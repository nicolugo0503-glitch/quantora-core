<!doctype html>
<html>
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Quantora Reporting</title><script src="/config.js"></script></head>
<body style="font-family: Arial, sans-serif; margin: 32px;">
  <h1>Institutional Reporting</h1>
  <button onclick="loadCurrent()">Load current reports</button>
  <pre id="out">Ready.</pre>
  <script>
    const API = window.QUANTORA_CONFIG.API_BASE_URL;
    async function loadCurrent(){
      const res = await fetch(`/reporting/current`);
      const data = await res.json();
      document.getElementById('out').textContent = JSON.stringify(data, null, 2);
    }
  </script>
</body>
</html>
