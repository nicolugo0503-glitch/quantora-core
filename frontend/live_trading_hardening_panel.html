
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>QNT30412 Live Trading Hardening</title>
  <style>
    body { background:#09101d; color:white; font-family:Arial; padding:20px; }
    input, select, button { padding:10px; margin:6px 0; border-radius:8px; }
    input, select { width: 280px; display:block; background:#0f1530; color:white; border:1px solid #44527a; }
    button { border:0; cursor:pointer; }
    pre { background:#0b1020; border:1px solid #2a395a; padding:12px; border-radius:8px; min-height:180px; }
  </style>
</head>
<body>
<h2>QNT30412 Live Trading Hardening</h2>
<select id="mode"><option>paper</option><option>live</option></select>
<input id="symbol" value="AAPL" placeholder="symbol">
<input id="qty" value="1" placeholder="qty">
<input id="price" value="100" placeholder="price">
<select id="side"><option>buy</option><option>sell</option></select>
<button onclick="statusLoad()">Refresh Status</button>
<button onclick="enableLive()">Enable Live Guarded</button>
<button onclick="precheck()">Precheck</button>
<button onclick="submitOrder()">Submit</button>
<pre id="out"></pre>
<script>
async function statusLoad(){
  const r = await fetch('/live-hardening-v2/status');
  out.innerText = JSON.stringify(await r.json(), null, 2);
}
async function enableLive(){
  const r = await fetch('/live-hardening-v2/config', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({live_enabled:true, kill_switch:false})
  });
  out.innerText = JSON.stringify(await r.json(), null, 2);
}
async function precheck(){
  const r = await fetch('/live-hardening-v2/precheck', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      symbol: symbol.value,
      side: side.value,
      qty: parseFloat(qty.value),
      price: parseFloat(price.value),
      mode: mode.value
    })
  });
  out.innerText = JSON.stringify(await r.json(), null, 2);
}
async function submitOrder(){
  const r = await fetch('/live-hardening-v2/submit', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      symbol: symbol.value,
      side: side.value,
      qty: parseFloat(qty.value),
      price: parseFloat(price.value),
      mode: mode.value
    })
  });
  out.innerText = JSON.stringify(await r.json(), null, 2);
}
statusLoad();
</script>
</body>
</html>
