<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Quantora QNT30509 Risk Guardrails</title>
  <style>
    :root { --bg:#08111f; --panel:#0e1a2b; --border:#1f3556; --text:#eef4ff; --muted:#9bb0ce; --good:#33d17a; --bad:#ff6b6b; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial,Helvetica,sans-serif; background:var(--bg); color:var(--text); padding:24px; }
    .btn { display:inline-block; color:#fff; background:#2455d6; border:1px solid #3f6fff; border-radius:10px; padding:10px 14px; text-decoration:none; font-weight:700; cursor:pointer; }
    .btn.secondary { background:#12233b; border-color:var(--border); }
    .panel { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:18px; margin-bottom:16px; }
    .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
    .stat { background:rgba(255,255,255,.02); border:1px solid var(--border); border-radius:12px; padding:14px; }
    .label { color:var(--muted); font-size:13px; margin-bottom:6px; }
    .value { font-size:24px; font-weight:700; }
    .good { color:var(--good); } .bad { color:var(--bad); } .muted { color:var(--muted); }
    pre { background:#07111f; border:1px solid var(--border); border-radius:10px; padding:14px; overflow:auto; }
    @media (max-width:900px) { .grid { grid-template-columns:repeat(2,1fr); } }
    @media (max-width:700px) { .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px">
    <div>
      <h1 style="margin:0 0 6px">QNT30509 — Risk Guardrails</h1>
      <div class="muted">Live-loop protection layer for exposure, drawdown, position count, and blocked symbols.</div>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <a class="btn secondary" href="conversation_missions_hub.html">Back to Missions Hub</a>
      <a class="btn" href="index.html">Back to Command Center</a>
    </div>
  </div>

  <div class="panel">
    <a class="btn" href="#" onclick="refreshRisk();return false;">Refresh Risk Report</a>
  </div>

  <div class="grid">
    <div class="stat"><div class="label">Severity</div><div class="value" id="severityBox">--</div></div>
    <div class="stat"><div class="label">Allow Loop To Run</div><div class="value" id="allowBox">--</div></div>
    <div class="stat"><div class="label">Drawdown %</div><div class="value" id="drawdownBox">--</div></div>
    <div class="stat"><div class="label">Position Count</div><div class="value" id="positionCountBox">--</div></div>
  </div>

  <div class="panel">
    <h2 style="margin-top:0">Full Risk Report</h2>
    <pre id="riskBox">loading...</pre>
  </div>

  <script>
    async function fetchJson(url) {
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error("HTTP " + res.status);
        return await res.json();
      } catch (e) {
        return null;
      }
    }

    async function refreshRisk() {
      const data = await fetchJson('/api/risk/report');

      if (!data) {
        document.getElementById('riskBox').textContent = JSON.stringify({ error: 'risk endpoint not found yet' }, null, 2);
        return;
      }

      document.getElementById('severityBox').textContent = data.severity || '--';
      document.getElementById('allowBox').textContent = String(data.allow_loop_to_run);
      document.getElementById('drawdownBox').textContent = String((data.metrics && data.metrics.drawdown_pct) ?? '--');
      document.getElementById('positionCountBox').textContent = String((data.metrics && data.metrics.position_count) ?? '--');
      document.getElementById('riskBox').textContent = JSON.stringify(data, null, 2);
    }

    refreshRisk();
    setInterval(refreshRisk, 5000);
  </script>
</body>
</html>
