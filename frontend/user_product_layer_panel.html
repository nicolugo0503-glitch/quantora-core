<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>QNT30385 User Product Layer</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; background: #09101d; color: #eef2fb; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .card { background: #121b2f; border: 1px solid #2c3959; border-radius: 12px; padding: 16px; }
    input, select, button { padding: 10px; border-radius: 8px; }
    input, select { width: 100%; margin-top: 6px; margin-bottom: 12px; border: 1px solid #44527a; background: #0f1530; color: #fff; }
    button { border: 0; cursor: pointer; }
    pre { white-space: pre-wrap; background: #0b1020; border: 1px solid #2a395a; padding: 12px; border-radius: 8px; min-height: 160px; }
  </style>
</head>
<body>
  <h1>QNT30385 — User Product Layer</h1>
  <div class="grid">
    <div class="card">
      <h3>Register User</h3>
      <label>User ID</label>
      <input id="user_id" value="client-001" />
      <label>Full Name</label>
      <input id="full_name" value="Quantora Client" />
      <label>Email</label>
      <input id="email" value="client@example.com" />
      <label>Plan</label>
      <select id="plan">
        <option>starter</option>
        <option>pro</option>
        <option>institutional</option>
      </select>
      <label>Risk Preset</label>
      <select id="risk_preset">
        <option>conservative</option>
        <option>balanced</option>
        <option>aggressive</option>
        <option>custom</option>
      </select>
      <button onclick="registerUser()">Register</button>
      <pre id="register_out"></pre>
    </div>
    <div class="card">
      <h3>Configure Portfolio</h3>
      <label>Target Capital</label>
      <input id="target_capital" value="50000" />
      <label>Automation Enabled</label>
      <select id="automation_enabled">
        <option value="true">true</option>
        <option value="false">false</option>
      </select>
      <label>Markets</label>
      <input id="markets" value="equities,crypto" />
      <button onclick="configurePortfolio()">Configure</button>
      <pre id="portfolio_out"></pre>
    </div>
  </div>
  <div class="card">
    <h3>Dashboard Status</h3>
    <button onclick="loadDashboard()">Load Dashboard</button>
    <pre id="dashboard_out"></pre>
  </div>
<script>
async function registerUser(){
  const payload = {
    user_id: document.getElementById('user_id').value,
    full_name: document.getElementById('full_name').value,
    email: document.getElementById('email').value,
    plan: document.getElementById('plan').value,
    risk_preset: document.getElementById('risk_preset').value
  };
  const res = await fetch('/product/user/register', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload)
  });
  document.getElementById('register_out').textContent = JSON.stringify(await res.json(), null, 2);
}
async function configurePortfolio(){
  const payload = {
    user_id: document.getElementById('user_id').value,
    target_capital: parseFloat(document.getElementById('target_capital').value),
    risk_preset: document.getElementById('risk_preset').value,
    market_access: document.getElementById('markets').value.split(',').map(x => x.trim()).filter(Boolean),
    automation_enabled: document.getElementById('automation_enabled').value === 'true'
  };
  const res = await fetch('/product/portfolio/configure', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload)
  });
  document.getElementById('portfolio_out').textContent = JSON.stringify(await res.json(), null, 2);
}
async function loadDashboard(){
  const user_id = document.getElementById('user_id').value;
  const res = await fetch('/product/dashboard/' + user_id);
  document.getElementById('dashboard_out').textContent = JSON.stringify(await res.json(), null, 2);
}
</script>
</body>
</html>
