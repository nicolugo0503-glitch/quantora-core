<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Quantora Conversation Missions</title>
  <style>
    :root {
      --bg:#07111f; --panel:#0f1d31; --line:#22314e; --text:#e5eefc; --muted:#9bb0d1; --accent:#2563eb;
    }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter,Arial,sans-serif; background:linear-gradient(180deg,#040b15 0%,#0a1424 100%); color:var(--text); }
    .shell { max-width:1480px; margin:0 auto; padding:24px; }
    .hero,.card { background:rgba(15,29,49,.95); border:1px solid var(--line); border-radius:18px; box-shadow:0 10px 30px rgba(0,0,0,.16); }
    .hero { padding:20px; margin-bottom:18px; }
    .sub { color:var(--muted); line-height:1.5; max-width:940px; }
    .btn { display:inline-block; text-decoration:none; color:#fff; background:#1d4ed8; border-radius:10px; padding:10px 14px; font-weight:700; }
    .grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; }
    .card { padding:16px; }
    .code { color:#8fb2ff; font-size:12px; letter-spacing:.08em; text-transform:uppercase; margin-bottom:8px; }
    .title { font-size:18px; font-weight:700; margin-bottom:8px; }
    .notes { color:var(--muted); line-height:1.45; min-height:72px; }
    .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
    @media (max-width:980px) { .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="shell">
    <div class="hero">
      <h1 style="margin:0 0 10px">Quantora Conversation Missions</h1>
      <div class="sub">Dynamic registry-driven mission hub. New missions are rendered from a single manifest so the UI stays synchronized as Quantora scales.</div>
      <div style="margin-top:14px"><a class="btn" href="index.html">Back to Command Center</a></div>
    </div>
    <div id="missionGrid" class="grid"></div>
  </div>
  <script src="qnt30519_dynamic_mission_loader.js"></script>
  <script>
    window.addEventListener("DOMContentLoaded", function () {
      window.QNT30519MissionRegistry.mountCards("#missionGrid");
    });
  </script>
</body>
</html>
