<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>QNT30404 Treasury, Reserve, and Liquidity Command</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; background: #09101d; color: #eef2fb; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .card { background: #121b2f; border: 1px solid #2c3959; border-radius: 12px; padding: 16px; }
    button, input, select { padding: 10px; border-radius: 8px; }
    input, select { width: 100%; margin-top: 6px; margin-bottom: 12px; border: 1px solid #44527a; background: #0f1530; color: #fff; }
    button { border: 0; cursor: pointer; margin-right: 8px; }
    pre { white-space: pre-wrap; background: #0b1020; border: 1px solid #2a395a; padding: 12px; border-radius: 8px; min-height: 220px; }
  </style>
</head>
<body>
  <h1>QNT30404 — Treasury, Reserve, and Liquidity Command</h1>
  <div class="grid">
    <div class="card">
      <h3>Liquidity Command</h3>
      <button onclick="loadStatus()">Refresh Status</button>
      <button onclick="autoBalance()">Auto Balance</button>
      <pre id="left"></pre>
    </div>
    <div class="card">
      <h3>Sweep Funds</h3>
      <label>Amount</label>
      <input id="amount" value="25000" />
      <label>From</label>
      <select id="from_bucket">
        <option>deployable_balance</option>
        <option>cash_balance</option>
        <option>reserve_balance</option>
      </select>
      <label>To</label>
      <select id="to_bucket">
        <option>reserve_balance</option>
        <option>cash_balance</option>
        <option>deployable_balance</option>
      </select>
      <button onclick="sweepFunds()">Sweep</button>
      <pre id="right"></pre>
    </div>
  </div>
<script>
async function loadStatus(){
  const res = await fetch('/treasury/status');
  document.getElementById('left').textContent = JSON.stringify(await res.json(), null, 2);
}
async function autoBalance(){
  const res = await fetch('/treasury/auto-balance', { method: 'POST' });
  document.getElementById('left').textContent = JSON.stringify(await res.json(), null, 2);
}
async function sweepFunds(){
  const payload = {
    amount: parseFloat(document.getElementById('amount').value),
    from_bucket: document.getElementById('from_bucket').value,
    to_bucket: document.getElementById('to_bucket').value,
    reason: 'operator_treasury_adjustment',
    operator_id: 'treasury-admin'
  };
  const res = await fetch('/treasury/sweep', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(payload)
  });
  document.getElementById('right').textContent = JSON.stringify(await res.json(), null, 2);
}
loadStatus();
</script>
</body>
</html>
