<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Quantora QNT30365 Strategy Factory</title>
  <style>
    :root { --bg:#07111f; --panel:#0f1d31; --panel2:#132742; --line:#22314e; --text:#e5eefc; --muted:#9bb0d1; --accent:#60a5fa; }
    *{box-sizing:border-box} body{margin:0;font-family:Inter,Arial,sans-serif;background:linear-gradient(180deg,#040b15 0%,#0a1424 100%);color:var(--text)}
    .shell{max-width:1280px;margin:0 auto;padding:24px}.panel{background:rgba(15,29,49,.95);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}
    .metrics,.row{display:grid;gap:12px}.metrics{grid-template-columns:repeat(4,minmax(0,1fr))}.row{grid-template-columns:repeat(2,minmax(0,1fr))}
    .metric{background:#0a1526;border:1px solid #1e2d47;border-radius:14px;padding:14px}.label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}.value{font-size:26px;font-weight:700;margin-top:8px}
    textarea,input,select{width:100%;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:11px 12px} textarea{min-height:180px}
    button{border:none;background:var(--accent);color:white;padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:700} button.secondary{background:#1d4ed8}
    pre{margin:0;background:#06101d;border:1px solid #1e2d47;border-radius:14px;padding:14px;min-height:260px;white-space:pre-wrap}.tiny{color:var(--muted);font-size:12px}
    @media(max-width:900px){.metrics,.row{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="shell">
  <div class="panel">
    <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap">
      <div>
        <h1 style="margin:0 0 8px 0;">Self-Evolving Strategy Factory + Autonomous Strategy Generation</h1>
        <div class="tiny">Generate, backtest, score, and promote new strategies through an institutional factory pipeline.</div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="secondary" onclick="window.location.href='index.html'">Command Center</button>
        <button onclick="loadStatus()">Refresh</button>
      </div>
    </div>
  </div>

  <div class="metrics">
    <div class="metric"><div class="label">Templates</div><div class="value" id="m1">-</div></div>
    <div class="metric"><div class="label">Candidates</div><div class="value" id="m2">-</div></div>
    <div class="metric"><div class="label">Promoted</div><div class="value" id="m3">-</div></div>
    <div class="metric"><div class="label">Factory Cycles</div><div class="value" id="m4">-</div></div>
  </div>

  <div class="row">
    <div class="panel">
      <h2 style="margin-top:0">Templates</h2>
      <textarea id="templates_body">{
  "templates": [
    {"name":"Momentum Core","market":"equities","signal_family":"momentum","timeframe":"1h","mutation_bias":"balanced"},
    {"name":"Mean Reversion Core","market":"equities","signal_family":"mean_reversion","timeframe":"15m","mutation_bias":"conservative"},
    {"name":"Crypto Breakout Core","market":"crypto","signal_family":"breakout","timeframe":"4h","mutation_bias":"aggressive"}
  ]
}</textarea>
      <div style="margin-top:10px"><button onclick="upsertTemplates()">Upsert Templates</button></div>
    </div>

    <div class="panel">
      <h2 style="margin-top:0">Factory Pipeline</h2>
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
        <input id="batch_size" type="number" value="4">
        <select id="generation_mode"><option value="mutation">mutation</option><option value="discovery">discovery</option><option value="hybrid">hybrid</option></select>
        <input id="promotion_score_threshold" type="number" value="67.5" step="0.1">
        <input id="min_backtest_win_rate" type="number" value="0.54" step="0.01">
      </div>
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
        <button onclick="generateCandidates()">Generate</button>
        <button onclick="backtestCandidates()">Backtest</button>
        <button class="secondary" onclick="promoteCandidates()">Promote</button>
      </div>
    </div>
  </div>

  <div class="panel"><h2 style="margin-top:0">Output</h2><pre id="out">Loading...</pre></div>
</div>

<script>
const API = "http://127.0.0.1:8010";
async function req(path, method="GET", body=null){
  const res = await fetch(API + path, {method, headers:{"Content-Type":"application/json"}, body: body ? JSON.stringify(body) : null});
  const data = await res.json();
  if(!res.ok) throw new Error(JSON.stringify(data));
  return data;
}
function render(data){
  document.getElementById("m1").textContent = data.template_count ?? "-";
  document.getElementById("m2").textContent = data.candidate_count ?? "-";
  document.getElementById("m3").textContent = data.promoted_count ?? "-";
  document.getElementById("m4").textContent = (data.strategy_factory || {}).factory_cycles ?? "-";
  document.getElementById("out").textContent = JSON.stringify(data, null, 2);
}
async function loadStatus(){ try{ render(await req("/strategy-factory/status")); } catch(e){ document.getElementById("out").textContent = String(e); } }
async function upsertTemplates(){
  try{
    const body = JSON.parse(document.getElementById("templates_body").value);
    const data = await req("/strategy-factory/templates/upsert", "POST", body);
    document.getElementById("out").textContent = JSON.stringify(data, null, 2); await loadStatus();
  }catch(e){ document.getElementById("out").textContent = String(e); }
}
async function generateCandidates(){
  try{
    const body = {
      batch_size: parseInt(document.getElementById("batch_size").value, 10),
      generation_mode: document.getElementById("generation_mode").value,
      promotion_score_threshold: parseFloat(document.getElementById("promotion_score_threshold").value),
      min_backtest_win_rate: parseFloat(document.getElementById("min_backtest_win_rate").value)
    };
    const data = await req("/strategy-factory/generate", "POST", body);
    document.getElementById("out").textContent = JSON.stringify(data, null, 2); await loadStatus();
  }catch(e){ document.getElementById("out").textContent = String(e); }
}
async function backtestCandidates(){
  try{
    const data = await req("/strategy-factory/backtest", "POST", {candidate_ids: []});
    document.getElementById("out").textContent = JSON.stringify(data, null, 2); await loadStatus();
  }catch(e){ document.getElementById("out").textContent = String(e); }
}
async function promoteCandidates(){
  try{
    const data = await req("/strategy-factory/promote", "POST", {promotion_score_threshold: parseFloat(document.getElementById("promotion_score_threshold").value)});
    document.getElementById("out").textContent = JSON.stringify(data, null, 2); await loadStatus();
  }catch(e){ document.getElementById("out").textContent = String(e); }
}
loadStatus();
</script>
</body>
</html>
