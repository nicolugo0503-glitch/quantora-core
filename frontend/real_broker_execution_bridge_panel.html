<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>QNT30406 Real Broker Execution Bridge</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; background: #09101d; color: #eef2fb; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .card { background: #121b2f; border: 1px solid #2c3959; border-radius: 12px; padding: 16px; }
    input, select, button { padding: 10px; border-radius: 8px; }
    input, select { width: 100%; margin-top: 6px; margin-bottom: 12px; border: 1px solid #44527a; background: #0f1530; color: #fff; }
    button { border: 0; cursor: pointer; margin-right: 8px; }
    pre { white-space: pre-wrap; background: #0b1020; border: 1px solid #2a395a; padding: 12px; border-radius: 8px; min-height: 180px; }
  </style>
</head>
<body>
  <h1>QNT30406 — Real Broker Execution Bridge</h1>
  <div class="grid">
    <div class="card">
      <h3>Broker Bridge</h3>
      <label>Mode</label>
      <select id="mode">
        <option>paper</option>
        <option>live</option>
      </select>
      <button onclick="connectEnv()">Connect Using Env</button>
      <button onclick="loadStatus()">Refresh Status</button>
      <pre id="left"></pre>
    </div>
    <div class="card">
      <h3>Submit Order</h3>
      <label>Symbol</label>
      <input id="symbol" value="AAPL" />
      <label>Side</label>
      <select id="side"><option>buy</option><option>sell</option></select>
      <label>Qty</label>
      <input id="qty" value="1" />
      <button onclick="submitOrder()">Submit Order</button>
      <pre id="right"></pre>
    </div>
  </div>
<script>
async function loadStatus(){
  const res = await fetch('/live-bridge/status');
  document.getElementById('left').textContent = JSON.stringify(await res.json(), null, 2);
}
async function connectEnv(){
  const payload = { mode: document.getElementById('mode').value };
  const res = await fetch('/live-bridge/connect', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(payload)
  });
  document.getElementById('left').textContent = JSON.stringify(await res.json(), null, 2);
}
async function submitOrder(){
  const payload = {
    symbol: document.getElementById('symbol').value,
    side: document.getElementById('side').value,
    qty: parseFloat(document.getElementById('qty').value),
    broker: 'alpaca'
  };
  const res = await fetch('/live-bridge/order/submit', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(payload)
  });
  document.getElementById('right').textContent = JSON.stringify(await res.json(), null, 2);
}
loadStatus();
</script>
</body>
</html>
