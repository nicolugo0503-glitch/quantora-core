
<!DOCTYPE html><html><head><meta charset="utf-8"/>
<title>Quantora Allocator Capital Deployment</title><script src="/config.js"></script></head>
<body style="font-family:Arial;margin:20px">
<h1>Allocator Capital Deployment</h1>
<button onclick="refreshAll()">Refresh</button>
<hr>
<input id="operator_id" placeholder="operator_id">
<input id="requested_capital" type="number" placeholder="Requested capital">
<button onclick="requestCapital()">Request Capital</button>
<hr>
<input id="allocation_id" placeholder="allocation_id">
<input id="approved_capital" type="number" placeholder="Approved capital">
<button onclick="approveCapital()">Approve Capital</button>
<pre id="out"></pre>
<script>
async function api(p,m='GET',b){
 const r=await fetch(API_BASE_URL+p,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});
 return await r.json();
}
async function refreshAll(){
 const operators=await api('/allocator/operators');
 const deployments=await api('/allocator/deployments');
 const capital=await api('/allocator/capital-state');
 const packets=await api('/allocator/packets');
 out.textContent=JSON.stringify({operators,deployments,capital,packets},null,2);
}
async function requestCapital(){
 const res=await api('/allocator/request-capital','POST',{operator_id:operator_id.value,requested_capital:parseFloat(requested_capital.value||'0')});
 out.textContent=JSON.stringify(res,null,2); await refreshAll();
}
async function approveCapital(){
 const res=await api('/allocator/approve-capital','POST',{allocation_id:allocation_id.value,approved_capital:parseFloat(approved_capital.value||'0')});
 out.textContent=JSON.stringify(res,null,2); await refreshAll();
}
refreshAll();
</script>
</body></html>
