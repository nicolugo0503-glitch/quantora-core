<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quantora Deployment Console</title>
  <script src="/config.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 32px; line-height: 1.4; }
    .card { border: 1px solid #ddd; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
    button { padding: 10px 14px; cursor: pointer; }
    code, pre { background: #f5f5f5; padding: 8px; border-radius: 6px; }
    .ok { color: #0a7a1f; }
    .bad { color: #b42318; }
  </style>
</head>
<body>
  <h1>Quantora Deploy Console</h1>
  <div class="card">
    <p><strong>API Base URL:</strong> <span id="apiBase"></span></p>
    <button onclick="checkHealth()">Check backend health</button>
    <button onclick="openDocs()">Open API docs</button>
    <pre id="healthOut">Not checked yet.</pre>
  </div>
  <div class="card">
    <h2>Surfaces</h2>
    <ul>
      <li><a href="/reporting.html">Institutional Reporting</a></li>
      <li><a href="/distribution.html">Allocator Distribution</a></li>
    </ul>
  </div>
  <script>
    const API = window.QUANTORA_CONFIG.API_BASE_URL;
    document.getElementById('apiBase').textContent = API;
    async function checkHealth() {
      const out = document.getElementById('healthOut');
      out.textContent = 'Checking...';
      try {
        const res = await fetch('/health');
        const data = await res.json();
        out.textContent = 'Health OK: ' + JSON.stringify(data, null, 2);
        out.className = 'ok';
      } catch (e) {
        out.textContent = `Health check failed: ${e.message}`;
        out.className = 'bad';
      }
    }
    function openDocs() { window.open('/docs', '_blank'); }
  </script>
</body>
</html>
