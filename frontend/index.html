
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Quantora QNT30321 Policy Engine + Approval Workflows</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f5f7fb; color: #111827; }
    .panel { background: white; border: 1px solid #d9dfeb; border-radius: 12px; padding: 14px; margin-bottom: 14px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    input, select { width: 100%; padding: 10px; margin-bottom: 8px; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 8px; }
    button { padding: 10px 14px; margin-right: 8px; margin-bottom: 8px; border-radius: 8px; border: none; background: #2563eb; color: white; cursor: pointer; }
    button.secondary { background: #475569; }
    pre { background: #08142d; color: #e2e8f0; padding: 14px; border-radius: 10px; white-space: pre-wrap; min-height: 120px; overflow: auto; }
  </style>
</head>
<body>
  <h1>Quantora QNT30321 Policy Engine + Approval Workflows</h1>
  <div class="grid2">
    <div class="panel">
      <h2>Auth + Operator Setup</h2>
      <input id="reg_name" placeholder="Display name">
      <input id="reg_email" placeholder="Email">
      <input id="reg_password" placeholder="Password" type="password">
      <button onclick="registerUser()">Register</button>
      <hr>
      <input id="login_email" placeholder="Email">
      <input id="login_password" placeholder="Password" type="password">
      <button onclick="loginUser()">Login</button>
      <button class="secondary" onclick="logoutUser()">Logout</button>
      <hr>
      <input id="strategy_name" placeholder="Strategy name">
      <input id="strategy_symbol" placeholder="Strategy symbol">
      <select id="strategy_side"><option value="buy">buy</option><option value="sell">sell</option></select>
      <input id="strategy_qty" type="number" placeholder="Default qty">
      <button onclick="registerStrategy()">Register Strategy</button>
      <input id="operator_capital" type="number" placeholder="Operator allocated capital">
      <button onclick="setOperatorCapital()">Set My Operator Capital</button>
      <pre id="setup_out">Ready.</pre>
    </div>
    <div class="panel">
      <h2>Policy + Approvals</h2>
      <button onclick="callGet('/policy-engine/policies','policy_out')">Policies</button>
      <input id="policy_id" placeholder="Policy ID">
      <input id="policy_threshold" type="number" placeholder="Threshold">
      <select id="policy_enabled"><option value="true">enabled</option><option value="false">disabled</option></select>
      <button onclick="updatePolicy()">Update Policy</button>
      <hr>
      <button onclick="callGet('/approvals/queue','policy_out')">Approval Queue</button>
      <input id="approval_request_id" placeholder="Approval Request ID">
      <select id="approval_decision"><option value="APPROVED">APPROVED</option><option value="REJECTED">REJECTED</option></select>
      <input id="approval_notes" placeholder="Notes">
      <button onclick="decideApproval()">Decide Approval</button>
      <pre id="policy_out">Ready.</pre>
    </div>
  </div>
  <div class="grid2">
    <div class="panel">
      <h2>Admin Actions</h2>
      <button onclick="callGet('/admin/control-tower','admin_out')">Control Tower</button>
      <button onclick="callGet('/governance/ledger','admin_out')">Governance Ledger</button>
      <hr>
      <input id="admin_operator_id" placeholder="Target operator ID">
      <input id="admin_operator_capital" type="number" placeholder="Allocated capital">
      <button onclick="adminSetCapital()">Admin Set Operator Capital</button>
      <select id="admin_loop_mode"><option value="internal">internal paper</option><option value="alpaca">alpaca paper</option></select>
      <input id="admin_loop_interval" type="number" value="60" placeholder="Interval seconds">
      <button onclick="adminStartLoop()">Admin Start Loop</button>
      <button onclick="adminRunAll()">Admin Run All Once</button>
      <pre id="admin_out">Ready.</pre>
    </div>
    <div class="panel">
      <h2>Governance Summary</h2>
      <button onclick="callGet('/governance/ledger/summary','gov_out')">Ledger Summary</button>
      <button onclick="callGet('/auth/me','gov_out')">Me</button>
      <button onclick="callGet('/allocator/capital-view','gov_out')">My Capital View</button>
      <pre id="gov_out">Ready.</pre>
    </div>
  </div>
  <script>
    async function api(path, method='GET', body=null) {
      const res = await fetch(path, {method, headers:{'Content-Type':'application/json'}, body: body ? JSON.stringify(body) : undefined});
      const text = await res.text();
      try { return JSON.parse(text); } catch { return {raw:text, status:res.status}; }
    }
    async function callGet(path, target) { document.getElementById(target).textContent = JSON.stringify(await api(path), null, 2); }
    async function callPost(path, body, target) { document.getElementById(target).textContent = JSON.stringify(await api(path,'POST',body), null, 2); }
    async function registerUser(){ await callPost('/auth/register',{display_name:reg_name.value,email:reg_email.value,password:reg_password.value},'setup_out'); }
    async function loginUser(){ await callPost('/auth/login',{email:login_email.value,password:login_password.value},'setup_out'); }
    async function logoutUser(){ await callPost('/auth/logout',{},'setup_out'); }
    async function registerStrategy(){ await callPost('/strategies/register',{name:strategy_name.value,symbol:strategy_symbol.value,side:strategy_side.value,default_qty:parseInt(strategy_qty.value||'0',10),enabled:true},'setup_out'); }
    async function setOperatorCapital(){ await callPost('/allocator/operator-capital/set',{allocated_capital:parseFloat(operator_capital.value||'0')},'setup_out'); }
    async function updatePolicy(){ await callPost('/policy-engine/policies/update',{policy_id:policy_id.value,threshold:parseFloat(policy_threshold.value||'0'),enabled:policy_enabled.value==='true'},'policy_out'); }
    async function decideApproval(){ await callPost('/approvals/decision',{request_id:approval_request_id.value,decision:approval_decision.value,notes:approval_notes.value},'policy_out'); }
    async function adminSetCapital(){ await callPost('/admin/operator-capital/set',{operator_id:admin_operator_id.value,allocated_capital:parseFloat(admin_operator_capital.value||'0')},'admin_out'); }
    async function adminStartLoop(){ await callPost('/admin/operator-loop/start',{operator_id:admin_operator_id.value,execution_mode:admin_loop_mode.value,interval_seconds:parseInt(admin_loop_interval.value||'60',10)},'admin_out'); }
    async function adminRunAll(){ await callPost('/admin/run-all-once',{},'admin_out'); }
  </script>
</body>
</html>
