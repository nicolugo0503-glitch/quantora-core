<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Quantora QNT30522 Closed Loop</title>
  <style>
    :root { --bg:#08111f; --panel:#0e1a2b; --border:#1f3556; --text:#eef4ff; --muted:#9bb0ce; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial,Helvetica,sans-serif; background:var(--bg); color:var(--text); padding:24px; }
    .btn { display:inline-block; color:#fff; background:#2455d6; border:1px solid #3f6fff; border-radius:10px; padding:10px 14px; text-decoration:none; font-weight:700; cursor:pointer; }
    .btn.secondary { background:#12233b; border-color:var(--border); }
    .panel { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:18px; margin-bottom:16px; }
    .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
    textarea, pre { width:100%; min-height:220px; background:#07111f; border:1px solid var(--border); border-radius:10px; padding:14px; color:var(--text); overflow:auto; }
    .muted { color:var(--muted); }
    @media (max-width:900px) { .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px">
    <div>
      <h1 style="margin:0 0 6px">QNT30522 — Closed-Loop Autonomous Fund</h1>
      <div class="muted">Signals → learning → allocation → execution plan → stored cycle history.</div>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <a class="btn secondary" href="conversation_missions_hub.html">Back to Missions Hub</a>
      <a class="btn" href="index.html">Back to Command Center</a>
    </div>
  </div>

  <div class="panel">
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <a class="btn" href="#" onclick="runCycle();return false;">Run Closed Loop</a>
      <a class="btn secondary" href="#" onclick="refreshData();return false;">Refresh</a>
    </div>
  </div>

  <div class="grid">
    <div class="panel">
      <div class="muted">Cycle Request JSON</div>
      <textarea id="requestBox">{
  "fund_id": "FUND1",
  "capital": 100000,
  "signals": {
    "crypto": 0.8,
    "equities": 0.5,
    "bonds": 0.2
  },
  "pnl_by_asset": {
    "crypto": 1200,
    "equities": -300,
    "bonds": 50
  },
  "dry_run": true
}</textarea>
    </div>
    <div class="panel">
      <div class="muted">Latest Cycle Result</div>
      <pre id="resultBox">loading...</pre>
    </div>
  </div>

  <div class="panel">
    <div class="muted">Cycle History</div>
    <pre id="historyBox">loading...</pre>
  </div>

  <script>
    async function fetchJson(url, options) {
      try {
        const res = await fetch(url, options || {});
        if (!res.ok) throw new Error("HTTP " + res.status);
        return await res.json();
      } catch (e) {
        return null;
      }
    }

    async function runCycle() {
      let payload;
      try {
        payload = JSON.parse(document.getElementById('requestBox').value);
      } catch (e) {
        alert('Invalid request JSON');
        return;
      }
      const result = await fetchJson('/api/closed-loop/run', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(payload)
      });
      document.getElementById('resultBox').textContent = JSON.stringify(result || { error: 'closed-loop endpoint not found yet' }, null, 2);
      refreshData();
    }

    async function refreshData() {
      const hist = await fetchJson('/api/closed-loop/cycles');
      document.getElementById('historyBox').textContent = JSON.stringify(hist || { error: 'history endpoint not found yet' }, null, 2);
    }

    refreshData();
  </script>
</body>
</html>
