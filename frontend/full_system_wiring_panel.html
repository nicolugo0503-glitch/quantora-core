<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>QNT30415 Full System Wiring</title>
  <style>
    body { background:#09101d; color:white; font-family:Arial; padding:20px; }
    input, button { padding:10px; margin:6px 0; border-radius:8px; }
    input { width:300px; display:block; background:#0f1530; color:white; border:1px solid #44527a; }
    button { border:0; cursor:pointer; margin-right:8px; }
    pre { background:#0b1020; border:1px solid #2a395a; padding:12px; border-radius:8px; min-height:200px; }
  </style>
</head>
<body>
<h2>QNT30415 Full System Wiring</h2>
<input id="display_name" placeholder="display name" value="nico">
<input id="email" placeholder="email" value="test@quantora.com">
<input id="password" placeholder="password" value="123456">
<button onclick="register()">Register</button>
<button onclick="login()">Login</button>
<button onclick="bind()">Bind Session</button>
<button onclick="statusLoad()">Runtime Status</button>
<pre id="out"></pre>
<script>
let runtimeToken = "";
async function register(){
  const r = await fetch('/platform/register',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({display_name:display_name.value,email:email.value,password:password.value})
  });
  out.innerText = JSON.stringify(await r.json(), null, 2);
}
async function login(){
  const r = await fetch('/platform/login',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({email:email.value,password:password.value})
  });
  const d = await r.json();
  if (d.token) runtimeToken = d.token;
  out.innerText = JSON.stringify(d, null, 2);
}
async function bind(){
  const r = await fetch('/platform/session/bind',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({token:runtimeToken})
  });
  out.innerText = JSON.stringify(await r.json(), null, 2);
}
async function statusLoad(){
  const r = await fetch('/platform/runtime/status');
  out.innerText = JSON.stringify(await r.json(), null, 2);
}
statusLoad();
</script>
</body>
</html>
