<!DOCTYPE html><html lang="en"><head><meta charset="utf-8" /><title>QNT30403 Global Risk Mesh & Capital Defense</title><style>
body { font-family: Arial, sans-serif; margin: 24px; background: #09101d; color: #eef2fb; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.card { background: #121b2f; border: 1px solid #2c3959; border-radius: 12px; padding: 16px; }
button, input { padding: 10px; border-radius: 8px; }
input { width: 100%; margin-top: 6px; margin-bottom: 12px; border: 1px solid #44527a; background: #0f1530; color: #fff; }
button { border: 0; cursor: pointer; margin-right: 8px; }
pre { white-space: pre-wrap; background: #0b1020; border: 1px solid #2a395a; padding: 12px; border-radius: 8px; min-height: 220px; }
</style></head><body><h1>QNT30403 — Global Risk Mesh & Capital Defense</h1><div class="grid"><div class="card"><h3>Risk Node Update</h3>
<label>Node</label><input id="node" value="market_stress" /><label>Value</label><input id="value" value="0.78" /><label>Threshold</label><input id="threshold" value="0.70" />
<button onclick="updateNode()">Update Node</button><button onclick="loadStatus()">Refresh Status</button><pre id="left"></pre></div>
<div class="card"><h3>Defense Actions</h3><button onclick="evaluateDefense()">Evaluate Defense</button><button onclick="loadActions()">Load Actions</button><pre id="right"></pre></div></div>
<script>
async function updateNode(){ const payload={node:document.getElementById('node').value,value:parseFloat(document.getElementById('value').value),threshold:parseFloat(document.getElementById('threshold').value)};
const res=await fetch('/global-risk-mesh/node/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}); document.getElementById('left').textContent=JSON.stringify(await res.json(),null,2);}
async function loadStatus(){ const res=await fetch('/global-risk-mesh/status'); document.getElementById('left').textContent=JSON.stringify(await res.json(),null,2);}
async function evaluateDefense(){ const res=await fetch('/global-risk-mesh/defense/evaluate',{method:'POST'}); document.getElementById('right').textContent=JSON.stringify(await res.json(),null,2);}
async function loadActions(){ const res=await fetch('/global-risk-mesh/defense-actions'); document.getElementById('right').textContent=JSON.stringify(await res.json(),null,2);}
loadStatus();
</script></body></html>
