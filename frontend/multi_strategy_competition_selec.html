<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>QNT30399 Multi-Strategy Competition & Selection Engine</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; background: #09101d; color: #eef2fb; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .card { background: #121b2f; border: 1px solid #2c3959; border-radius: 12px; padding: 16px; }
    button, input { padding: 10px; border-radius: 8px; }
    input { width: 100%; margin-top: 6px; margin-bottom: 12px; border: 1px solid #44527a; background: #0f1530; color: #fff; }
    button { border: 0; cursor: pointer; margin-right: 8px; }
    pre { white-space: pre-wrap; background: #0b1020; border: 1px solid #2a395a; padding: 12px; border-radius: 8px; min-height: 220px; }
  </style>
</head>
<body>
  <h1>QNT30399 — Multi-Strategy Competition & Selection Engine</h1>
  <div class="grid">
    <div class="card">
      <h3>Competition</h3>
      <label>Capital Budget</label>
      <input id="capital_budget" value="100000" />
      <button onclick="seedStrategies()">Seed Strategies</button>
      <button onclick="runCompetition()">Run Competition</button>
      <pre id="left"></pre>
    </div>
    <div class="card">
      <h3>Rankings</h3>
      <button onclick="loadStatus()">Refresh Status</button>
      <button onclick="loadChampion()">Load Champion</button>
      <pre id="right"></pre>
    </div>
  </div>
<script>
async function seedStrategies(){
  const payload = {
    strategies: [
      {strategy_id:'alpha-exec-01', name:'Alpha Execution', regime_fit:0.92, sharpe:2.1, realized_pnl:12000, drawdown:0.04, win_rate:0.64, execution_quality:0.91},
      {strategy_id:'regime-alloc-02', name:'Regime Allocation', regime_fit:0.88, sharpe:1.8, realized_pnl:9300, drawdown:0.05, win_rate:0.61, execution_quality:0.86},
      {strategy_id:'meanrev-03', name:'Mean Reversion', regime_fit:0.71, sharpe:1.2, realized_pnl:4200, drawdown:0.08, win_rate:0.56, execution_quality:0.79}
    ]
  };
  const res = await fetch('/strategy-competition/strategies/upsert', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(payload)
  });
  document.getElementById('left').textContent = JSON.stringify(await res.json(), null, 2);
}
async function runCompetition(){
  const payload = {
    regime: 'normal',
    capital_budget: parseFloat(document.getElementById('capital_budget').value),
    max_selected: 3
  };
  const res = await fetch('/strategy-competition/run', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(payload)
  });
  document.getElementById('left').textContent = JSON.stringify(await res.json(), null, 2);
}
async function loadStatus(){
  const res = await fetch('/strategy-competition/status');
  document.getElementById('right').textContent = JSON.stringify(await res.json(), null, 2);
}
async function loadChampion(){
  const res = await fetch('/strategy-competition/champion');
  document.getElementById('right').textContent = JSON.stringify(await res.json(), null, 2);
}
loadStatus();
</script>
</body>
</html>
