<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Quantora First Deposit</title>
<style>
body{margin:0;font-family:Inter,Arial;background:#06101d;color:#fff;padding:40px}
.wrap{max-width:720px;margin:auto}
.card{background:#0d1a2b;border:1px solid #203251;border-radius:16px;padding:24px}
input,button{width:100%;padding:12px;margin-top:10px;border-radius:10px;border:none;box-sizing:border-box}
input{background:#07111f;color:#fff;border:1px solid #203251}
button{background:#10b981;color:white;font-weight:700;cursor:pointer}
.muted{color:#9fb3d8}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1 style="margin-top:0">First Deposit</h1>
    <div class="muted">This deposit goes into your isolated user ledger, not the shared system ledger.</div>
    <input id="amount" placeholder="Amount">
    <button onclick="deposit()">Deposit</button>
    <div class="muted" id="msg" style="margin-top:12px"></div>
  </div>
</div>
<script>
async function deposit(){
  const amt = Number(document.getElementById('amount').value || 0);
  const r = await fetch('/api/user-capital/deposit', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({amount: amt})});
  const data = await r.json();
  if(!r.ok){ document.getElementById('msg').textContent = data.detail || 'Deposit failed'; return; }
  window.location.href = 'investor_portal.html';
}
</script>
</body>
</html>
