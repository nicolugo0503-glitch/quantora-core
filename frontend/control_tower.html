
<!DOCTYPE html>
<html><head><title>Control Tower</title></head>
<body style="background:#09101d;color:white;font-family:Arial;padding:20px">
<h1>QNT30405 Control Tower</h1>
<button onclick="status()">Refresh</button>
<button onclick="alertSys()">Send Alert</button>
<pre id="out"></pre>
<script>
async function status(){
 let r=await fetch('/control-tower/status');
 document.getElementById('out').textContent=JSON.stringify(await r.json(),null,2);
}
async function alertSys(){
 let r=await fetch('/control-tower/alert?message=System check&severity=info',{method:'POST'});
 document.getElementById('out').textContent=JSON.stringify(await r.json(),null,2);
}
status();
</script>
</body></html>
