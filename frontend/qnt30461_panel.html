<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Quantora — Strategy Research Lab + Alpha Pipeline</title>
  <style>
    :root{--bg:#07111f;--panel:#0f1d31;--panel2:#132742;--line:#22314e;--text:#e5eefc;--muted:#9bb0d1;--accent:#60a5fa;--good:#34d399;--warn:#f59e0b;}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,Arial,sans-serif;background:linear-gradient(180deg,#040b15 0%,#0a1424 100%);color:var(--text)}
    .wrap{max-width:1440px;margin:0 auto;padding:24px}
    .hero,.card{background:rgba(15,29,49,.96);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
    .hero{padding:22px;margin-bottom:18px;display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
    .sub{color:var(--muted);max-width:980px;line-height:1.5}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap}
    button{border-radius:10px;border:none;background:var(--accent);color:var(--text);padding:10px 12px;cursor:pointer;font-weight:700}
    .grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:18px}
    .card{padding:16px}.label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}.value{font-size:28px;font-weight:700;margin-top:8px}
    .layout{display:grid;grid-template-columns:1.15fr 1fr;gap:16px}.stack{display:grid;gap:16px}
    table{width:100%;border-collapse:collapse;font-size:13px} th,td{padding:9px 10px;border-bottom:1px solid #1e2d47;text-align:left}
    th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
    .table-wrap{overflow:auto;border:1px solid #1e2d47;border-radius:14px;background:#0a1526}
    .pills{display:flex;gap:8px;flex-wrap:wrap}.pill{padding:6px 10px;border-radius:999px;border:1px solid #274168;background:#0b1a2c;font-size:12px}
    .good{color:#9ff0ce;border-color:#256b53}.warn{color:#fcd68f;border-color:#8a5a0a}
    pre{margin:0;background:#06101d;border:1px solid #1e2d47;border-radius:14px;padding:14px;min-height:180px;white-space:pre-wrap}
  </style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div>
      <h1>QNT30461 — Strategy Research Lab + Alpha Pipeline</h1>
      <div class="sub">Research hypotheses, experiments, alpha candidates, and validations. This is the front-end of strategy creation before capital is deployed.</div>
    </div>
    <div class="toolbar">
      <button onclick="loadAll()">Refresh</button>
      <button onclick="seedHypothesis()">Seed Hypothesis</button>
      <button onclick="seedExperiment()">Seed Experiment</button>
      <button onclick="seedCandidate()">Seed Candidate</button>
      <button onclick="seedValidation()">Seed Validation</button>
    </div>
  </div>
  <div class="grid" id="summaryGrid"></div>
  <div class="layout">
    <div class="stack">
      <div class="card"><h2>Research Hypotheses</h2><div class="table-wrap"><table id="hypothesisTable"></table></div></div>
      <div class="card"><h2>Experiments</h2><div class="table-wrap"><table id="experimentTable"></table></div></div>
    </div>
    <div class="stack">
      <div class="card"><h2>Alpha Candidates</h2><div class="table-wrap"><table id="candidateTable"></table></div></div>
      <div class="card"><h2>Validations</h2><div class="table-wrap"><table id="validationTable"></table></div></div>
      <div class="card"><h2>Lab Health</h2><div class="pills" id="healthPills"></div></div>
      <div class="card"><h2>Last Action</h2><pre id="actionOut">No action yet.</pre></div>
    </div>
  </div>
</div>
<script>
const api=(path, opts={})=>fetch(path,{credentials:'include',headers:{'Content-Type':'application/json'},...opts}).then(async r=>{const d=await r.json().catch(()=>({}));if(!r.ok) throw new Error(d.detail||'request_failed'); return d;});
function table(el, headers, rows){ const thead=`<tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr>`; const body=rows.length?rows.map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${headers.length}">No data</td></tr>`; el.innerHTML=thead+body; }
function renderSummary(summary){ const labels=[['Hypotheses',summary.hypotheses_total],['Active',summary.active_hypotheses],['Experiments',summary.experiments_total],['Running',summary.running_experiments],['Candidates',summary.alpha_candidates],['Lab Score',summary.lab_score]]; document.getElementById('summaryGrid').innerHTML=labels.map(([l,v])=>`<div class="card"><div class="label">${l}</div><div class="value">${v}</div></div>`).join('');}
function pills(target, items){ document.getElementById(target).innerHTML=items.map(([l,k])=>`<span class="pill ${k}">${l}</span>`).join(''); }
async function loadAll(){
  const data=await api('/workspace/research-lab/summary');
  renderSummary(data.summary);
  table(document.getElementById('hypothesisTable'), ['Hypothesis','Domain','Status','Owner','Created'], (data.hypotheses||[]).map(r=>[r.hypothesis_name,r.research_domain,r.status,r.owner,r.created_at||'-']));
  table(document.getElementById('experimentTable'), ['Experiment','Dataset','Status','Sharpe','Created'], (data.experiments||[]).map(r=>[r.experiment_name,r.dataset_name,r.status,r.sharpe_estimate,r.created_at||'-']));
  table(document.getElementById('candidateTable'), ['Candidate','Family','Status','Score','Created'], (data.alpha_candidates||[]).map(r=>[r.candidate_name,r.signal_family,r.status,r.score,r.created_at||'-']));
  table(document.getElementById('validationTable'), ['Validation','Candidate','Status','Confidence','Created'], (data.validations||[]).map(r=>[r.validation_name,r.candidate_name,r.status,r.confidence,r.created_at||'-']));
  pills('healthPills', [
    [`Research ${data.lab_health.research_registry_ready?'Ready':'Missing'}`, data.lab_health.research_registry_ready?'good':'warn'],
    [`Experiments ${data.lab_health.experiment_engine_ready?'Ready':'Missing'}`, data.lab_health.experiment_engine_ready?'good':'warn'],
    [`Alpha ${data.lab_health.alpha_pipeline_ready?'Ready':'Missing'}`, data.lab_health.alpha_pipeline_ready?'good':'warn'],
    [`Validation ${data.lab_health.validation_engine_ready?'Ready':'Missing'}`, data.lab_health.validation_engine_ready?'good':'warn'],
    [`Score ${data.lab_health.lab_score}`, data.lab_health.lab_score>=85?'good':'warn']
  ]);
}
async function seedHypothesis(){ const res=await api('/workspace/research-lab/hypotheses/create',{method:'POST',body:JSON.stringify({hypothesis_name:'Post-Earnings Drift Capture',research_domain:'equities_event_driven',status:'active',owner:'research_lead'})}); document.getElementById('actionOut').textContent=JSON.stringify(res,null,2); await loadAll(); }
async function seedExperiment(){ const res=await api('/workspace/research-lab/experiments/create',{method:'POST',body:JSON.stringify({experiment_name:'PED Backtest v1',dataset_name:'us_equities_daily',status:'running',sharpe_estimate:1.42})}); document.getElementById('actionOut').textContent=JSON.stringify(res,null,2); await loadAll(); }
async function seedCandidate(){ const res=await api('/workspace/research-lab/candidates/create',{method:'POST',body:JSON.stringify({candidate_name:'PED Alpha 01',signal_family:'event_driven',status:'approved',score:84.5})}); document.getElementById('actionOut').textContent=JSON.stringify(res,null,2); await loadAll(); }
async function seedValidation(){ const res=await api('/workspace/research-lab/validations/create',{method:'POST',body:JSON.stringify({validation_name:'Walk-Forward Validation',candidate_name:'PED Alpha 01',status:'passed',confidence:91.2})}); document.getElementById('actionOut').textContent=JSON.stringify(res,null,2); await loadAll(); }
loadAll().catch(err=>document.getElementById('actionOut').textContent=String(err));
</script>
</body>
</html>
