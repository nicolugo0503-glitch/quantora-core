<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Quantora QNT30518 Onboarding</title>
  <style>
    :root { --bg:#08111f; --panel:#0e1a2b; --border:#1f3556; --text:#eef4ff; --muted:#9bb0ce; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial,Helvetica,sans-serif; background:var(--bg); color:var(--text); padding:24px; }
    .btn { display:inline-block; color:#fff; background:#2455d6; border:1px solid #3f6fff; border-radius:10px; padding:10px 14px; text-decoration:none; font-weight:700; cursor:pointer; }
    .btn.secondary { background:#12233b; border-color:var(--border); }
    .panel { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:18px; margin-bottom:16px; }
    .formgrid { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; }
    .muted { color:var(--muted); }
    input, pre { width:100%; background:#07111f; border:1px solid var(--border); border-radius:10px; padding:12px; color:var(--text); }
    label { display:block; margin-bottom:8px; color:var(--muted); }
    @media (max-width:900px) { .formgrid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px">
    <div>
      <h1 style="margin:0 0 6px">QNT30518 — Investor Onboarding + Subscription</h1>
      <div class="muted">Investor intake and subscription workflow for fund admission.</div>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <a class="btn secondary" href="conversation_missions_hub.html">Back to Missions Hub</a>
      <a class="btn" href="index.html">Back to Command Center</a>
    </div>
  </div>

  <div class="panel">
    <div class="formgrid">
      <div><label>Investor ID</label><input id="investorId" value="INV100"></div>
      <div><label>Name</label><input id="investorName" value="Atlas Family Office"></div>
      <div><label>Email</label><input id="email" value="atlas@example.com"></div>
      <div><label>Fund ID</label><input id="fundId" value="FUND1"></div>
      <div><label>Jurisdiction / Amount</label><input id="extra" value="US"></div>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px">
      <a class="btn" href="#" onclick="createOnboarding();return false;">Create Onboarding</a>
      <a class="btn secondary" href="#" onclick="createSubscription();return false;">Create Subscription</a>
      <a class="btn secondary" href="#" onclick="refreshSummary();return false;">Refresh</a>
    </div>
  </div>

  <div class="panel">
    <h2 style="margin-top:0">Onboarding + Subscription Summary</h2>
    <pre id="summaryBox">loading...</pre>
  </div>

  <script>
    async function fetchJson(url, options) {
      try {
        const res = await fetch(url, options || {});
        if (!res.ok) throw new Error("HTTP " + res.status);
        return await res.json();
      } catch (e) {
        return null;
      }
    }

    async function createOnboarding() {
      await fetchJson('/api/onboarding/create', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          investor_id: document.getElementById('investorId').value,
          investor_name: document.getElementById('investorName').value,
          email: document.getElementById('email').value,
          fund_id: document.getElementById('fundId').value,
          jurisdiction: document.getElementById('extra').value,
          status: 'pending_review'
        })
      });
      refreshSummary();
    }

    async function createSubscription() {
      const amount = Number(prompt('Subscription amount', '50000') || 0);
      await fetchJson('/api/subscription/request', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          investor_id: document.getElementById('investorId').value,
          fund_id: document.getElementById('fundId').value,
          amount: amount,
          currency: 'USD',
          source: 'ui'
        })
      });
      refreshSummary();
    }

    async function refreshSummary() {
      const fundId = document.getElementById('fundId').value;
      const summary = await fetchJson('/api/onboarding/summary?fund_id=' + encodeURIComponent(fundId));
      document.getElementById('summaryBox').textContent = JSON.stringify(summary || { error: 'onboarding summary endpoint not found yet' }, null, 2);
    }

    refreshSummary();
  </script>
</body>
</html>
