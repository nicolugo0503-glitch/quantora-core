<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Quantora QNT30362 Operator Command Mesh</title>
  <style>
    :root { --bg:#07111f; --panel:#0f1d31; --panel2:#132742; --line:#22314e; --text:#e5eefc; --muted:#9bb0d1; --accent:#60a5fa; }
    *{box-sizing:border-box} body{margin:0;font-family:Inter,Arial,sans-serif;background:linear-gradient(180deg,#040b15 0%,#0a1424 100%);color:var(--text)}
    .shell{max-width:1280px;margin:0 auto;padding:24px}.panel{background:rgba(15,29,49,.95);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}
    .metrics,.row{display:grid;gap:12px}.metrics{grid-template-columns:repeat(4,minmax(0,1fr))}.row{grid-template-columns:repeat(2,minmax(0,1fr))}
    .metric{background:#0a1526;border:1px solid #1e2d47;border-radius:14px;padding:14px}.label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}.value{font-size:26px;font-weight:700;margin-top:8px}
    textarea,input,select{width:100%;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:11px 12px} textarea{min-height:180px}
    button{border:none;background:var(--accent);color:white;padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:700} button.secondary{background:#1d4ed8}
    pre{margin:0;background:#06101d;border:1px solid #1e2d47;border-radius:14px;padding:14px;min-height:260px;white-space:pre-wrap}.tiny{color:var(--muted);font-size:12px}
    @media(max-width:900px){.metrics,.row{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="shell">
  <div class="panel">
    <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap">
      <div>
        <h1 style="margin:0 0 8px 0;">Operator Command Mesh + Delegated Mandate Framework</h1>
        <div class="tiny">Govern delegated operators with mandate-bound command routing, live gating, and controlled execution promotion.</div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="secondary" onclick="window.location.href='index.html'">Command Center</button>
        <button onclick="loadStatus()">Refresh</button>
      </div>
    </div>
  </div>

  <div class="metrics">
    <div class="metric"><div class="label">Operators</div><div class="value" id="m1">-</div></div>
    <div class="metric"><div class="label">Mandates</div><div class="value" id="m2">-</div></div>
    <div class="metric"><div class="label">Pending</div><div class="value" id="m3">-</div></div>
    <div class="metric"><div class="label">Executed</div><div class="value" id="m4">-</div></div>
  </div>

  <div class="row">
    <div class="panel">
      <h2 style="margin-top:0">Mandates</h2>
      <textarea id="mandates">{
  "operators": [
    {"operator_id":"operator_alpha","display_name":"Operator Alpha","tier":"delegate"},
    {"operator_id":"operator_beta","display_name":"Operator Beta","tier":"delegate"}
  ],
  "mandates": [
    {"operator_id":"operator_alpha","scope":"equities","allowed_modes":["paper","live"],"max_notional":15000,"active":true},
    {"operator_id":"operator_beta","scope":"crypto","allowed_modes":["paper"],"max_notional":5000,"active":true}
  ]
}</textarea>
      <div style="margin-top:10px"><button onclick="upsertMandates()">Upsert Mandates</button></div>
    </div>

    <div class="panel">
      <h2 style="margin-top:0">Route Command</h2>
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
        <input id="operator_id" value="operator_alpha">
        <input id="symbol" value="AAPL">
        <input id="action" value="buy">
        <select id="execution_mode"><option value="paper">paper</option><option value="live">live</option></select>
        <input id="notional" type="number" value="12000">
        <input id="priority" value="high">
      </div>
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
        <button onclick="routeCommand()">Route</button>
        <button class="secondary" onclick="executePending()">Execute Pending</button>
      </div>
    </div>
  </div>

  <div class="panel">
    <h2 style="margin-top:0">Output</h2>
    <pre id="out">Loading...</pre>
  </div>
</div>

<script>
const API = "http://127.0.0.1:8010";
async function req(path, method="GET", body=null){
  const res = await fetch(API + path, {method, headers:{"Content-Type":"application/json"}, body: body ? JSON.stringify(body) : null});
  const data = await res.json();
  if(!res.ok) throw new Error(JSON.stringify(data));
  return data;
}
function render(data){
  document.getElementById("m1").textContent = data.operator_count ?? "-";
  document.getElementById("m2").textContent = data.mandate_count ?? "-";
  document.getElementById("m3").textContent = data.pending_commands ?? "-";
  document.getElementById("m4").textContent = data.executed_commands ?? "-";
  document.getElementById("out").textContent = JSON.stringify(data, null, 2);
}
async function loadStatus(){ try{ render(await req("/command-mesh/status")); } catch(e){ document.getElementById("out").textContent = String(e); } }
async function upsertMandates(){
  try{
    const body = JSON.parse(document.getElementById("mandates").value);
    const data = await req("/command-mesh/mandates/upsert", "POST", body);
    document.getElementById("out").textContent = JSON.stringify(data, null, 2);
    await loadStatus();
  }catch(e){ document.getElementById("out").textContent = String(e); }
}
async function routeCommand(){
  try{
    const body = {
      command: {
        operator_id: document.getElementById("operator_id").value,
        action: document.getElementById("action").value,
        symbol: document.getElementById("symbol").value,
        execution_mode: document.getElementById("execution_mode").value,
        priority: document.getElementById("priority").value,
        notional: parseFloat(document.getElementById("notional").value)
      }
    };
    const data = await req("/command-mesh/route", "POST", body);
    document.getElementById("out").textContent = JSON.stringify(data, null, 2);
    await loadStatus();
  }catch(e){ document.getElementById("out").textContent = String(e); }
}
async function executePending(){
  try{
    const data = await req("/command-mesh/execute", "POST", {approve_live:true});
    document.getElementById("out").textContent = JSON.stringify(data, null, 2);
    await loadStatus();
  }catch(e){ document.getElementById("out").textContent = String(e); }
}
loadStatus();
</script>
</body>
</html>
