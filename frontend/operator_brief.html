<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>QNT30431 Operator Brief</title>
<style>body{font-family:Arial,sans-serif;background:#07111f;color:#eaf1ff;margin:0}.wrap{max-width:1200px;margin:0 auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card{background:#0d1f38;border:1px solid #19345c;border-radius:16px;padding:18px}.muted{color:#9fb4d5}button{background:#2f6bff;color:#fff;border:none;border-radius:10px;padding:10px 14px;cursor:pointer;margin-right:8px}pre{white-space:pre-wrap;word-break:break-word;background:#081423;padding:14px;border-radius:12px}</style></head>
<body><div class="wrap"><div class="card" style="margin-bottom:16px;"><h1>QNT30431 · Operator Brief + Reporting Layer</h1><p class="muted">Unified operator-facing daily brief for PnL, risk, strategies, and governance.</p><button onclick="refreshAll()">Refresh Brief</button><button onclick="window.location.href='/org_execution_capital_engine.html'">Back to Org Engine</button></div><div class="grid"><div class="card"><h2>Daily Brief</h2><div id="daily"></div></div><div class="card"><h2>Risk Brief</h2><div id="risk"></div></div><div class="card"><h2>Strategy Brief</h2><div id="strategies"></div></div><div class="card"><h2>Governance Brief</h2><div id="governance"></div></div></div></div><script>async function loadJSON(u){const r=await fetch(u);const d=await r.json();if(!r.ok) throw new Error(d.detail||('http_'+r.status));return d;} function pretty(x){return '<pre>'+JSON.stringify(x,null,2)+'</pre>';} async function refreshAll(){ const [a,b,c,d]= await Promise.all([loadJSON('/workspace/brief/daily'),loadJSON('/workspace/brief/risk'),loadJSON('/workspace/brief/strategies'),loadJSON('/workspace/brief/governance')]); document.getElementById('daily').innerHTML=pretty(a.brief||a); document.getElementById('risk').innerHTML=pretty(b.risk||b); document.getElementById('strategies').innerHTML=pretty(c.strategies||c); document.getElementById('governance').innerHTML=pretty(d.governance||d);} refreshAll();</script></body></html>
