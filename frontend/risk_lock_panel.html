<!doctype html><html><head><meta charset="utf-8"><title>QNT30344 Risk Lock</title><style>body{font-family:Arial;background:#07111f;color:#eaf2ff;padding:24px}button,input{padding:10px;margin:6px;border-radius:8px;border:1px solid #2d4c7a;background:#0e1d33;color:#fff}button{background:#245bff}pre{background:#0b1728;padding:16px;border-radius:12px;white-space:pre-wrap}</style></head><body><h1>QNT30344 Risk Lock</h1><p>Use /docs for full control. Quick panel below.</p><div><input id="maxTrades" type="number" value="2"/><input id="maxNotional" type="number" value="20"/><input id="maxLoss" type="number" value="10"/><button onclick="save()">Save Risk Lock</button><button onclick="status()">Load Status</button><button onclick="kill()">Kill Switch</button></div><pre id="out">ready</pre><script>async function j(u,m='GET',b){const r=await fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});const t=await r.text();document.getElementById('out').textContent=t;} function save(){j('/risk-lock/config','POST',{enabled:true,max_position_notional:5000,max_total_exposure:20000,max_drawdown_pct:12,max_daily_loss:Number(maxLoss.value),max_orders_per_run:3,max_trades_per_session:Number(maxTrades.value),max_notional_per_trade:Number(maxNotional.value),live_risk_lock_required:true,require_broker_for_alpaca:true,auto_shutdown_on_breach:true});} function status(){j('/risk-lock/status');} function kill(){j('/risk-lock/kill','POST',{});} status();</script></body></html>
