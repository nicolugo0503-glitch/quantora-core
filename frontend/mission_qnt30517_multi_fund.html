<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Quantora QNT30517 Multi-Fund</title>
  <style>
    :root { --bg:#08111f; --panel:#0e1a2b; --border:#1f3556; --text:#eef4ff; --muted:#9bb0ce; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial,Helvetica,sans-serif; background:var(--bg); color:var(--text); padding:24px; }
    .btn { display:inline-block; color:#fff; background:#2455d6; border:1px solid #3f6fff; border-radius:10px; padding:10px 14px; text-decoration:none; font-weight:700; cursor:pointer; }
    .btn.secondary { background:#12233b; border-color:var(--border); }
    .panel { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:18px; margin-bottom:16px; }
    .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
    .formgrid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
    .muted { color:var(--muted); }
    input, pre { width:100%; background:#07111f; border:1px solid var(--border); border-radius:10px; padding:12px; color:var(--text); }
    label { display:block; margin-bottom:8px; color:var(--muted); }
    @media (max-width:900px) { .grid, .formgrid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px">
    <div>
      <h1 style="margin:0 0 6px">QNT30517 — Multi-Fund / Multi-Portfolio Layer</h1>
      <div class="muted">Create funds, portfolios, and allocation targets across multiple capital pools.</div>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <a class="btn secondary" href="conversation_missions_hub.html">Back to Missions Hub</a>
      <a class="btn" href="index.html">Back to Command Center</a>
    </div>
  </div>

  <div class="panel">
    <div class="formgrid">
      <div><label>Fund ID</label><input id="fundId" value="FUND2"></div>
      <div><label>Name</label><input id="name" value="Quantora Macro Fund"></div>
      <div><label>Portfolio ID</label><input id="portfolioId" value="PORT1"></div>
      <div><label>Target %</label><input id="targetPct" type="number" value="50"></div>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px">
      <a class="btn" href="#" onclick="createFund();return false;">Create Fund</a>
      <a class="btn secondary" href="#" onclick="createPortfolio();return false;">Create Portfolio</a>
      <a class="btn secondary" href="#" onclick="setAllocation();return false;">Set Allocation</a>
      <a class="btn secondary" href="#" onclick="refreshSummary();return false;">Refresh</a>
    </div>
  </div>

  <div class="panel">
    <h2 style="margin-top:0">Multi-Fund Summary</h2>
    <pre id="summaryBox">loading...</pre>
  </div>

  <script>
    async function fetchJson(url, options) {
      try {
        const res = await fetch(url, options || {});
        if (!res.ok) throw new Error("HTTP " + res.status);
        return await res.json();
      } catch (e) {
        return null;
      }
    }

    function currentFundId() {
      return document.getElementById('fundId').value || '';
    }

    async function createFund() {
      await fetchJson('/api/multifund/fund', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          fund_id: document.getElementById('fundId').value,
          name: document.getElementById('name').value,
          base_currency: 'USD',
          status: 'active'
        })
      });
      refreshSummary();
    }

    async function createPortfolio() {
      await fetchJson('/api/multifund/portfolio', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          portfolio_id: document.getElementById('portfolioId').value,
          fund_id: document.getElementById('fundId').value,
          name: document.getElementById('name').value + ' Portfolio',
          mandate: 'multi-portfolio mandate'
        })
      });
      refreshSummary();
    }

    async function setAllocation() {
      await fetchJson('/api/multifund/allocation', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          fund_id: document.getElementById('fundId').value,
          portfolio_id: document.getElementById('portfolioId').value,
          target_pct: Number(document.getElementById('targetPct').value || 0),
          note: 'ui allocation update'
        })
      });
      refreshSummary();
    }

    async function refreshSummary() {
      const fundId = currentFundId();
      const url = '/api/multifund/summary' + (fundId ? ('?fund_id=' + encodeURIComponent(fundId)) : '');
      const summary = await fetchJson(url);
      document.getElementById('summaryBox').textContent = JSON.stringify(summary || { error: 'multifund summary endpoint not found yet' }, null, 2);
    }

    refreshSummary();
  </script>
</body>
</html>
