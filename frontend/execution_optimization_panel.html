
<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quantora Execution Optimization</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; background: #0b1020; color: #e8ecf3; }
    .card { background: #121933; border: 1px solid #26345f; border-radius: 14px; padding: 18px; margin-bottom: 18px; }
    input, select, button { padding: 10px; margin: 6px 0; border-radius: 8px; border: 1px solid #41548a; }
    button { cursor: pointer; }
    pre { white-space: pre-wrap; word-break: break-word; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  </style>
</head>
<body>
  <h1>QNT30349 Execution Optimization</h1>
  <div class="card">
    <p>Estimate slippage, choose order type, and route through execution-aware controls.</p>
    <div class="grid">
      <label>Symbol <input id="symbol" value="AAPL"></label>
      <label>Side <select id="side"><option>buy</option><option>sell</option></select></label>
      <label>Qty <input id="qty" type="number" value="10" step="0.01"></label>
      <label>Urgency <select id="urgency"><option>patient</option><option selected>balanced</option><option>aggressive</option></select></label>
      <label>Execution Mode <select id="mode"><option>paper</option><option>live</option><option>internal</option></select></label>
      <label>Max Slippage (bps) <input id="maxslip" type="number" value="30" step="0.1"></label>
    </div>
    <button onclick="planOrder()">Build Plan</button>
    <button onclick="routeOrder()">Route Order</button>
  </div>
  <div class="card"><h3>Status</h3><pre id="status">loading...</pre></div>
  <div class="card"><h3>Plan / Route Output</h3><pre id="output">ready</pre></div>
  <script>
    async function api(path, method='GET', body=null){
      const res = await fetch(path, {method, headers:{'Content-Type':'application/json'}, body: body ? JSON.stringify(body) : null});
      return res.json();
    }
    function payload(){
      return {
        symbol: document.getElementById('symbol').value,
        side: document.getElementById('side').value,
        qty: Number(document.getElementById('qty').value),
        order_type: 'market',
        execution_mode: document.getElementById('mode').value,
        urgency: document.getElementById('urgency').value,
        max_slippage_bps: Number(document.getElementById('maxslip').value),
      };
    }
    async function refresh(){
      document.getElementById('status').textContent = JSON.stringify(await api('/execution-optimization/status'), null, 2);
    }
    async function planOrder(){
      document.getElementById('output').textContent = JSON.stringify(await api('/execution-optimization/plan', 'POST', payload()), null, 2);
      refresh();
    }
    async function routeOrder(){
      const body = payload();
      body.governance_approved = body.execution_mode !== 'live';
      document.getElementById('output').textContent = JSON.stringify(await api('/execution-optimization/route', 'POST', body), null, 2);
      refresh();
    }
    refresh();
  </script>
</body>
</html>
