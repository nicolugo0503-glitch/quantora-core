<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>QNT30397 Investor Reporting & Operator Intelligence</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; background: #09101d; color: #eef2fb; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .card { background: #121b2f; border: 1px solid #2c3959; border-radius: 12px; padding: 16px; }
    button, input { padding: 10px; border-radius: 8px; }
    input { width: 100%; margin-top: 6px; margin-bottom: 12px; border: 1px solid #44527a; background: #0f1530; color: #fff; }
    button { border: 0; cursor: pointer; margin-right: 8px; }
    pre { white-space: pre-wrap; background: #0b1020; border: 1px solid #2a395a; padding: 12px; border-radius: 8px; min-height: 220px; }
  </style>
</head>
<body>
  <h1>QNT30397 — Investor Reporting & Operator Intelligence</h1>
  <div class="grid">
    <div class="card">
      <h3>Investor Reporting</h3>
      <label>Period Label</label>
      <input id="period_label" value="Monthly Review" />
      <button onclick="generateInvestorReport()">Generate Investor Report</button>
      <button onclick="loadStatus()">Refresh Status</button>
      <pre id="left"></pre>
    </div>
    <div class="card">
      <h3>Operator Intelligence</h3>
      <button onclick="generateOperatorBrief()">Generate Operator Brief</button>
      <button onclick="loadAlerts()">Load Alerts</button>
      <pre id="right"></pre>
    </div>
  </div>
<script>
async function loadStatus(){
  const res = await fetch('/reporting/status');
  document.getElementById('left').textContent = JSON.stringify(await res.json(), null, 2);
}
async function generateInvestorReport(){
  const payload = {
    period_label: document.getElementById('period_label').value,
    audience: 'investor',
    include_operator_notes: true
  };
  const res = await fetch('/reporting/investor-report/generate', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload)
  });
  document.getElementById('left').textContent = JSON.stringify(await res.json(), null, 2);
}
async function generateOperatorBrief(){
  const res = await fetch('/reporting/operator-brief/generate', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({focus: 'daily', include_risk: true, include_execution: true, include_capital: true})
  });
  document.getElementById('right').textContent = JSON.stringify(await res.json(), null, 2);
}
async function loadAlerts(){
  const res = await fetch('/reporting/alerts');
  document.getElementById('right').textContent = JSON.stringify(await res.json(), null, 2);
}
loadStatus();
</script>
</body>
</html>
