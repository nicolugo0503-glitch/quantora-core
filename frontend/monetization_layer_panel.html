<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>QNT30386 Monetization Layer</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; background: #09101d; color: #eef2fb; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .card { background: #121b2f; border: 1px solid #2c3959; border-radius: 12px; padding: 16px; }
    input, select, button { padding: 10px; border-radius: 8px; }
    input, select { width: 100%; margin-top: 6px; margin-bottom: 12px; border: 1px solid #44527a; background: #0f1530; color: #fff; }
    button { border: 0; cursor: pointer; }
    pre { white-space: pre-wrap; background: #0b1020; border: 1px solid #2a395a; padding: 12px; border-radius: 8px; min-height: 160px; }
  </style>
</head>
<body>
  <h1>QNT30386 — Monetization Layer</h1>
  <div class="grid">
    <div class="card">
      <h3>Register Customer</h3>
      <label>Customer ID</label>
      <input id="customer_id" value="client-001" />
      <label>Full Name</label>
      <input id="full_name" value="Quantora Client" />
      <label>Email</label>
      <input id="email" value="client@example.com" />
      <label>Plan</label>
      <select id="plan">
        <option>starter</option>
        <option>pro</option>
        <option>institutional</option>
      </select>
      <button onclick="registerCustomer()">Register</button>
      <pre id="register_out"></pre>
    </div>
    <div class="card">
      <h3>Create Subscription + Fee Accrual</h3>
      <button onclick="createSubscription()">Create Subscription</button>
      <button onclick="accrueFee()">Accrue Performance Fee</button>
      <pre id="ops_out"></pre>
    </div>
  </div>
  <div class="card">
    <h3>Customer Monetization Dashboard</h3>
    <button onclick="loadDashboard()">Load Dashboard</button>
    <pre id="dashboard_out"></pre>
  </div>
<script>
async function registerCustomer(){
  const payload = {
    customer_id: document.getElementById('customer_id').value,
    full_name: document.getElementById('full_name').value,
    email: document.getElementById('email').value,
    plan: document.getElementById('plan').value
  };
  const res = await fetch('/monetization/customer/register', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload)
  });
  document.getElementById('register_out').textContent = JSON.stringify(await res.json(), null, 2);
}
async function createSubscription(){
  const payload = {
    customer_id: document.getElementById('customer_id').value,
    plan: document.getElementById('plan').value,
    billing_cycle: 'monthly',
    autopay: true
  };
  const res = await fetch('/monetization/subscription/create', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload)
  });
  document.getElementById('ops_out').textContent = JSON.stringify(await res.json(), null, 2);
}
async function accrueFee(){
  const payload = {
    customer_id: document.getElementById('customer_id').value,
    gross_profit: 12500,
    high_water_mark: 100000
  };
  const res = await fetch('/monetization/performance-fee/accrue', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload)
  });
  document.getElementById('ops_out').textContent = JSON.stringify(await res.json(), null, 2);
}
async function loadDashboard(){
  const customer_id = document.getElementById('customer_id').value;
  const res = await fetch('/monetization/dashboard/' + customer_id);
  document.getElementById('dashboard_out').textContent = JSON.stringify(await res.json(), null, 2);
}
</script>
</body>
</html>
