<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Quantora Client Onboarding</title>
<style>
body{margin:0;font-family:Inter,Arial;background:#06101d;color:#eaf1ff}
.container{max-width:900px;margin:auto;padding:40px}
.card{background:#0d1a2b;border:1px solid #203251;border-radius:16px;padding:24px;margin-bottom:20px}
h1{margin-bottom:10px}
.step{margin-bottom:20px}
.label{font-size:12px;color:#9fb3d8;text-transform:uppercase;margin-bottom:6px}
input,select{width:100%;padding:10px;border-radius:8px;border:1px solid #203251;background:#07111f;color:white}
button{margin-top:10px;padding:12px 16px;background:#2455d6;border:none;color:white;border-radius:8px;cursor:pointer;font-weight:bold}
.progress{height:6px;background:#203251;border-radius:10px;margin-bottom:20px}
.progress-bar{height:100%;width:25%;background:#2455d6;border-radius:10px}
</style>
</head>
<body>
<div class="container">
<h1>Client Onboarding</h1>

<div class="progress"><div id="progressBar" class="progress-bar"></div></div>

<div id="step1" class="card step">
<div class="label">Step 1</div>
<h3>Basic Information</h3>
<input placeholder="Full Name">
<input placeholder="Email">
<button onclick="next(2)">Continue</button>
</div>

<div id="step2" class="card step" style="display:none">
<div class="label">Step 2</div>
<h3>Investor Profile</h3>
<select><option>Accredited Investor</option><option>Retail Investor</option></select>
<select><option>Low Risk</option><option>Medium Risk</option><option>High Risk</option></select>
<button onclick="next(3)">Continue</button>
</div>

<div id="step3" class="card step" style="display:none">
<div class="label">Step 3</div>
<h3>Capital Allocation</h3>
<input placeholder="Initial Investment ($)">
<button onclick="next(4)">Continue</button>
</div>

<div id="step4" class="card step" style="display:none">
<div class="label">Step 4</div>
<h3>Confirmation</h3>
<p>Review your information and confirm onboarding.</p>
<button onclick="complete()">Complete Onboarding</button>
</div>

</div>

<script>
function next(step){
for(let i=1;i<=4;i++){
document.getElementById('step'+i).style.display = (i===step)?'block':'none';
}
document.getElementById('progressBar').style.width = (step*25)+'%';
}

function complete(){
alert('Onboarding Complete (UI only)');
}
</script>

</body>
</html>
