<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>QNT30718 Executive AI Command Layer</title><style>:root{--bg:#071019;--panel:#0d1723;--line:#1b2b40;--text:#edf3fb;--muted:#8ea0b7;--good:#48d597;--bad:#ff6f86;--warn:#ffc857}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#071019,#09131d 55%,#071019);color:var(--text);font-family:Inter,system-ui,sans-serif}.wrap{max-width:1360px;margin:0 auto;padding:24px}h1{margin:0 0 6px}p{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:18px 0}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:14px 0}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}.label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.value{font-size:28px;font-weight:800;margin-top:6px}.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 0}.toolbar input,.toolbar select,.toolbar button{background:#09111a;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px 12px}.toolbar button{cursor:pointer}table{width:100%;border-collapse:collapse}th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}pre{white-space:pre-wrap;word-break:break-word;background:#08101a;border:1px solid var(--line);border-radius:12px;padding:12px;max-height:320px;overflow:auto}</style></head><body><div class="wrap"><h1>QNT30718 Executive AI Command Layer</h1><p>Highest-level command scoring for capital directives, cross-system alignment, explainability, and governed executive command posture.</p><div class="toolbar"><button onclick="bootstrapDemo()">Bootstrap Demo</button><select id="scope"><option value="EXECUTIVE_CAPITAL_COMMAND">EXECUTIVE_CAPITAL_COMMAND</option><option value="PORTFOLIO_OVERRIDE_COMMAND">PORTFOLIO_OVERRIDE_COMMAND</option></select><input id="directive" type="text" value="compound-with-controlled-rotation"><input id="conviction" type="number" step="0.1" value="92"><input id="alignment" type="number" step="0.1" value="93"><button onclick="evaluateCommand()">Evaluate Command</button></div><div class="grid"><div class="card"><div class="label">Executive Posture</div><div id="posture" class="value">-</div></div><div class="card"><div class="label">Latest Score</div><div id="score" class="value">-</div></div><div class="card"><div class="label">Recommended Band</div><div id="band" class="value">-</div></div><div class="card"><div class="label">Commands</div><div id="commands" class="value">0</div></div></div><div class="grid2"><div class="card"><div class="label">Current Context</div><pre id="contextBox">Loading...</pre></div><div class="card"><div class="label">Latest Command</div><pre id="commandBox">Loading...</pre></div></div></div><script>async function api(path,options={}){const res=await fetch(path,{credentials:'include',headers:{'Content-Type':'application/json'},...options});if(!res.ok) throw new Error(await res.text());return res.json();}function fmt(v){return JSON.stringify(v,null,2)}function badge(el,text){el.textContent=text||'-';el.className='value '+((/APPROVED|CLEAR|READY|ALLOCATE|TILT/i.test(text||''))?'good':(/BLOCK|DEFEND/i.test(text||''))?'bad':'warn');}function render(data){const s=data.executive_ai_command_layer_status||{};badge(document.getElementById('posture'),s.posture);document.getElementById('score').textContent=s.latest_score??'-';badge(document.getElementById('band'),s.recommended_band);document.getElementById('commands').textContent=s.command_count??0;document.getElementById('contextBox').textContent=fmt(data.last_context||{});document.getElementById('commandBox').textContent=fmt(data.latest_command||{});}async function load(){try{render(await api('/api/executive-ai-command-layer/summary'));}catch(e){document.getElementById('contextBox').textContent=String(e);}}async function bootstrapDemo(){await api('/api/executive-ai-command-layer/bootstrap-demo',{method:'POST'});load();}async function evaluateCommand(){const payload={command_scope:document.getElementById('scope').value,capital_directive:document.getElementById('directive').value,conviction_score:parseFloat(document.getElementById('conviction').value||'0'),explainability_score:90,capital_readiness_score:91,scenario_coverage_pct:89,cross_system_alignment_score:parseFloat(document.getElementById('alignment').value||'0'),urgency_score:78,open_exceptions:0,live_execute:false};await api('/api/executive-ai-command-layer/evaluate',{method:'POST',body:JSON.stringify(payload)});load();}load();</script></body></html>
