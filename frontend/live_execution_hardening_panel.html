<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>QNT30395 Live Execution Hardening</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; background: #09101d; color: #eef2fb; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .card { background: #121b2f; border: 1px solid #2c3959; border-radius: 12px; padding: 16px; }
    input, select, button { padding: 10px; border-radius: 8px; }
    input, select { width: 100%; margin-top: 6px; margin-bottom: 12px; border: 1px solid #44527a; background: #0f1530; color: #fff; }
    button { border: 0; cursor: pointer; margin-right: 8px; }
    pre { white-space: pre-wrap; background: #0b1020; border: 1px solid #2a395a; padding: 12px; border-radius: 8px; min-height: 160px; }
  </style>
</head>
<body>
  <h1>QNT30395 — Live Execution Hardening</h1>
  <div class="grid">
    <div class="card">
      <h3>Controls</h3>
      <button onclick="armLive()">Arm Live</button>
      <button onclick="freezeLive()">Kill Switch</button>
      <button onclick="loadStatus()">Refresh Status</button>
      <pre id="status_out"></pre>
    </div>
    <div class="card">
      <h3>Guarded Live Request</h3>
      <label>Symbol</label>
      <input id="symbol" value="AAPL" />
      <label>Side</label>
      <select id="side"><option>buy</option><option>sell</option></select>
      <label>Qty</label>
      <input id="qty" value="1" />
      <label>Price</label>
      <input id="price" value="100" />
      <button onclick="requestTrade()">Request Trade</button>
      <pre id="trade_out"></pre>
    </div>
  </div>
<script>
async function loadStatus(){
  const res = await fetch('/live-hardening/status');
  document.getElementById('status_out').textContent = JSON.stringify(await res.json(), null, 2);
}
async function armLive(){
  const res = await fetch('/live-hardening/controls/update', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ live_enabled: true, kill_switch: false, require_dual_confirmation: true })
  });
  document.getElementById('status_out').textContent = JSON.stringify(await res.json(), null, 2);
}
async function freezeLive(){
  const res = await fetch('/live-hardening/kill-switch?enabled=true', { method: 'POST' });
  document.getElementById('status_out').textContent = JSON.stringify(await res.json(), null, 2);
}
async function requestTrade(){
  const payload = {
    symbol: document.getElementById('symbol').value,
    side: document.getElementById('side').value,
    qty: parseFloat(document.getElementById('qty').value),
    price: parseFloat(document.getElementById('price').value)
  };
  const res = await fetch('/live-hardening/request', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload)
  });
  document.getElementById('trade_out').textContent = JSON.stringify(await res.json(), null, 2);
}
loadStatus();
</script>
</body>
</html>
