<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>QNT30723 Institutional Allocation Execution Charter Layer</title><style>:root{--bg:#071019;--panel:#0d1723;--line:#1b2b40;--text:#edf3fb;--muted:#8ea0b7;--good:#48d597;--bad:#ff6f86;--warn:#ffc857}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#071019,#09131d 55%,#071019);color:var(--text);font-family:Inter,system-ui,sans-serif}.wrap{max-width:1360px;margin:0 auto;padding:24px}h1{margin:0 0 6px}p{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin:18px 0}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:14px 0}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}.label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.value{font-size:28px;font-weight:800;margin-top:6px}.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 0}.toolbar input,.toolbar button{background:#09111a;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px 12px}.toolbar button{cursor:pointer}pre{white-space:pre-wrap;word-break:break-word;background:#08101a;border:1px solid var(--line);border-radius:12px;padding:12px;max-height:320px;overflow:auto}</style></head><body><div class="wrap"><h1>QNT30723 Institutional Allocation Execution Charter Layer</h1><p>Authorize the governed execution charter for capital allocation after arbitration and policy approval.</p><div class="toolbar"><button onclick="bootstrapDemo()">Bootstrap Demo</button><input id="title" type="text" value="authorize institutional allocation execution charter"><input id="summaryIn" type="text" value="Stage execution waves with liquidity and reserve controls"><button onclick="evaluateNow()">Evaluate Charter</button></div><div class="grid"><div class="card"><div class="label">Charter Posture</div><div id="posture" class="value">-</div></div><div class="card"><div class="label">Latest Score</div><div id="score" class="value">-</div></div><div class="card"><div class="label">Execution Band</div><div id="band" class="value">-</div></div><div class="card"><div class="label">Charter Runs</div><div id="runCount" class="value">0</div></div><div class="card"><div class="label">Alerts</div><div id="alertCount" class="value">0</div></div></div><div class="grid2"><div class="card"><div class="label">Current Context</div><pre id="contextBox">Loading...</pre></div><div class="card"><div class="label">Latest Charter Run</div><pre id="charterBox">Loading...</pre></div></div></div><script>async function api(path,options={}){const res=await fetch(path,{credentials:'include',headers:{'Content-Type':'application/json'},...options});if(!res.ok) throw new Error(await res.text());return res.json()}function fmt(v){return JSON.stringify(v,null,2)}function badge(el,text){el.textContent=text||'-';el.className='value '+((/APPROVED|EXECUTE|READY|CLEAR/i.test(text||''))?'good':(/BLOCK|DEFEND|DO_NOT_EXECUTE/i.test(text||''))?'bad':'warn')}function render(data){const s=data.institutional_allocation_execution_charter_layer_status||{};badge(document.getElementById('posture'),s.posture);document.getElementById('score').textContent=s.latest_score??'-';badge(document.getElementById('band'),s.execution_band);document.getElementById('runCount').textContent=s.charter_run_count??0;document.getElementById('alertCount').textContent=s.alert_count??0;document.getElementById('contextBox').textContent=fmt(data.last_context||{});document.getElementById('charterBox').textContent=fmt({latest_charter_run:data.latest_charter_run||{},alerts:data.alerts||[],policy:data.policy||{}})}async function load(){try{render(await api('/api/institutional-allocation-execution-charter-layer/summary'))}catch(e){document.getElementById('contextBox').textContent=String(e)}}async function bootstrapDemo(){await api('/api/institutional-allocation-execution-charter-layer/bootstrap-demo',{method:'POST'});load()}function payload(){return {title:document.getElementById('title').value,summary:document.getElementById('summaryIn').value,proposed_notional:420000,execution_waves:3,liquidity_buffer_pct:0.14,estimated_crossing_cost_bps:18,reserve_hold_pct:0.11,execution_style:'STAGED_LIMITED_ROTATION'}}async function evaluateNow(){await api('/api/institutional-allocation-execution-charter-layer/evaluate',{method:'POST',body:JSON.stringify(payload())});load()}load();</script></body></html>
