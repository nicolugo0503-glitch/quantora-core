<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>QNT30388 Identity, Auth, and Multi-Tenant Access Control</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; background: #08101d; color: #edf2fb; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .card { background: #121b2f; border: 1px solid #2c3959; border-radius: 12px; padding: 16px; }
    input, select, button { padding: 10px; border-radius: 8px; }
    input, select { width: 100%; margin-top: 6px; margin-bottom: 12px; border: 1px solid #44527a; background: #0f1530; color: #fff; }
    button { border: 0; cursor: pointer; }
    pre { white-space: pre-wrap; background: #0b1020; border: 1px solid #2a395a; padding: 12px; border-radius: 8px; min-height: 160px; }
  </style>
</head>
<body>
  <h1>QNT30388 — Identity, Auth, and Multi-Tenant Access Control</h1>
  <div class="grid">
    <div class="card">
      <h3>Create Tenant</h3>
      <label>Tenant ID</label>
      <input id="tenant_id" value="tenant-001" />
      <label>Tenant Name</label>
      <input id="tenant_name" value="Quantora Capital Client" />
      <button onclick="createTenant()">Create Tenant</button>
      <pre id="tenant_out"></pre>
    </div>
    <div class="card">
      <h3>Create User</h3>
      <label>User ID</label>
      <input id="user_id" value="user-001" />
      <label>Full Name</label>
      <input id="full_name" value="Client Admin" />
      <label>Email</label>
      <input id="email" value="admin@example.com" />
      <label>Password</label>
      <input id="password" value="quantora123" />
      <label>Role</label>
      <select id="role">
        <option>owner</option>
        <option>admin</option>
        <option>analyst</option>
        <option>viewer</option>
      </select>
      <button onclick="createUser()">Create User</button>
      <pre id="user_out"></pre>
    </div>
  </div>
  <div class="grid">
    <div class="card">
      <h3>Login</h3>
      <button onclick="login()">Login</button>
      <pre id="login_out"></pre>
    </div>
    <div class="card">
      <h3>Tenant Dashboard</h3>
      <button onclick="loadDashboard()">Load Dashboard</button>
      <pre id="dashboard_out"></pre>
    </div>
  </div>
<script>
async function createTenant(){
  const payload = {
    tenant_id: document.getElementById('tenant_id').value,
    tenant_name: document.getElementById('tenant_name').value
  };
  const res = await fetch('/identity/tenant/create', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload)
  });
  document.getElementById('tenant_out').textContent = JSON.stringify(await res.json(), null, 2);
}
async function createUser(){
  const payload = {
    user_id: document.getElementById('user_id').value,
    tenant_id: document.getElementById('tenant_id').value,
    full_name: document.getElementById('full_name').value,
    email: document.getElementById('email').value,
    password: document.getElementById('password').value,
    role: document.getElementById('role').value
  };
  const res = await fetch('/identity/user/create', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload)
  });
  document.getElementById('user_out').textContent = JSON.stringify(await res.json(), null, 2);
}
async function login(){
  const payload = {
    tenant_id: document.getElementById('tenant_id').value,
    email: document.getElementById('email').value,
    password: document.getElementById('password').value
  };
  const res = await fetch('/identity/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload)
  });
  document.getElementById('login_out').textContent = JSON.stringify(await res.json(), null, 2);
}
async function loadDashboard(){
  const tenant_id = document.getElementById('tenant_id').value;
  const res = await fetch('/identity/tenant/' + tenant_id + '/dashboard');
  document.getElementById('dashboard_out').textContent = JSON.stringify(await res.json(), null, 2);
}
</script>
</body>
</html>
