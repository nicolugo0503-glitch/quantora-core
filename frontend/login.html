<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Quantora</title>
<style>
  :root {
    --bg: #0a0f1e; --bg2: #0d1426; --bg3: #0f1a2e;
    --card: #111827; --border: #1e2d45; --border2: #2a3f5f;
    --text: #e8edf5; --dim: #8899aa; --muted: #4a6080;
    --cyan: #00d4ff; --purple: #7c3aed; --green: #00e676;
    --red: #ff4444; --gold: #ffd700;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── NAV ── */
  nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 40px;
    border-bottom: 1px solid var(--border);
    background: var(--bg2);
  }
  .nav-logo {
    font-size: 1.2rem; font-weight: 900; letter-spacing: 2px;
    background: linear-gradient(90deg, #fff, var(--cyan));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    text-decoration: none;
  }
  .nav-link {
    color: var(--dim); text-decoration: none; font-size: 0.85rem;
    font-weight: 500;
  }
  .nav-link:hover { color: var(--cyan); }

  /* ── MAIN ── */
  main {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 60px 20px;
    background: radial-gradient(ellipse at 50% 0%, rgba(0,212,255,0.05) 0%, transparent 60%);
  }
  .auth-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 48px;
    width: 100%; max-width: 420px;
    box-shadow: 0 24px 80px rgba(0,0,0,0.5);
  }
  .auth-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 12px; border-radius: 20px;
    background: rgba(0,212,255,0.08);
    border: 1px solid rgba(0,212,255,0.2);
    font-size: 0.7rem; font-weight: 700; letter-spacing: 1.5px;
    color: var(--cyan); text-transform: uppercase;
    margin-bottom: 24px;
  }
  .auth-badge .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 6px var(--cyan);
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .auth-title {
    font-size: 1.9rem; font-weight: 900; letter-spacing: -0.5px;
    margin-bottom: 8px;
    background: linear-gradient(90deg, #fff 0%, var(--cyan) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .auth-sub {
    color: var(--dim); font-size: 0.9rem; margin-bottom: 36px;
    line-height: 1.5;
  }

  /* ── FORM ── */
  .form-group { margin-bottom: 20px; }
  label {
    display: block; font-size: 0.75rem; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase;
    color: var(--muted); margin-bottom: 8px;
  }
  input[type="email"], input[type="password"], input[type="text"] {
    width: 100%;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 16px;
    color: var(--text); font-size: 0.95rem;
    font-family: inherit;
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
  }
  input:focus {
    border-color: var(--cyan);
    box-shadow: 0 0 0 3px rgba(0,212,255,0.1);
  }
  input::placeholder { color: var(--muted); }
  .form-row {
    display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 24px;
  }
  .remember-me { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .remember-me input[type="checkbox"] { accent-color: var(--cyan); cursor: pointer; }
  .remember-me span { font-size: 0.83rem; color: var(--dim); }
  .forgot-link { font-size: 0.83rem; color: var(--cyan); text-decoration: none; }
  .forgot-link:hover { opacity: 0.8; }

  .btn-primary {
    width: 100%; padding: 14px;
    background: linear-gradient(135deg, var(--cyan), var(--purple));
    border: none; border-radius: 10px;
    color: #fff; font-size: 1rem; font-weight: 700;
    cursor: pointer; transition: all 0.2s;
    font-family: inherit; letter-spacing: 0.5px;
    position: relative; overflow: hidden;
  }
  .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 8px 30px rgba(0,212,255,0.25); }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  .divider {
    display: flex; align-items: center; gap: 16px;
    margin: 28px 0; color: var(--muted); font-size: 0.8rem;
  }
  .divider::before, .divider::after {
    content: ''; flex: 1; height: 1px; background: var(--border);
  }

  .signup-link {
    text-align: center; font-size: 0.88rem; color: var(--dim);
  }
  .signup-link a { color: var(--cyan); text-decoration: none; font-weight: 600; }
  .signup-link a:hover { opacity: 0.8; }

  /* ── ERROR / SUCCESS ── */
  .alert {
    padding: 12px 16px; border-radius: 8px;
    font-size: 0.85rem; font-weight: 500;
    margin-bottom: 20px; display: none;
  }
  .alert-error { background: rgba(255,68,68,0.1); border: 1px solid rgba(255,68,68,0.3); color: #ff6b6b; }
  .alert-success { background: rgba(0,230,118,0.1); border: 1px solid rgba(0,230,118,0.3); color: var(--green); }
  .alert.show { display: block; }

  /* ── SPINNER ── */
  .spinner {
    display: inline-block; width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle; margin-right: 8px; display: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── FOOTER ── */
  footer {
    text-align: center; padding: 20px;
    font-size: 0.75rem; color: var(--muted);
    border-top: 1px solid var(--border);
  }
  footer a { color: var(--muted); text-decoration: none; }
  footer a:hover { color: var(--cyan); }
</style>
</head>
<body>

<nav>
  <a href="/" class="nav-logo">⚡ QUANTORA</a>
  <a href="/signup" class="nav-link">Don't have an account? <strong style="color:var(--cyan)">Sign up free →</strong></a>
</nav>

<main>
  <div class="auth-card">
    <div class="auth-badge"><span class="dot"></span>Secure Login</div>
    <div class="auth-title">Welcome back</div>
    <div class="auth-sub">Sign in to your Quantora account to access your intelligence dashboard.</div>

    <div class="alert alert-error" id="errorMsg"></div>
    <div class="alert alert-success" id="successMsg"></div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <div class="form-row">
        <label class="remember-me">
          <input type="checkbox" id="remember"> <span>Remember me</span>
        </label>
        <a href="/forgot-password" class="forgot-link">Forgot password?</a>
      </div>
      <button type="submit" class="btn-primary" id="submitBtn">
        <span class="spinner" id="spinner"></span>
        <span id="btnText">Sign In to Quantora</span>
      </button>
    </form>

    <div class="divider">or</div>
    <div class="signup-link">
      New to Quantora? <a href="/signup">Create a free account →</a>
    </div>
  </div>
</main>

<footer>
  <a href="/">Home</a> · <a href="/pricing">Pricing</a> · <a href="/docs">API Docs</a> · <a href="/ui/">Panels</a>
  &nbsp;|&nbsp; Paper trading only. Not financial advice.
</footer>

<script>
const B = window.location.origin;

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.classList.add('show');
  document.getElementById('successMsg').classList.remove('show');
}
function showSuccess(msg) {
  const el = document.getElementById('successMsg');
  el.textContent = msg;
  el.classList.add('show');
  document.getElementById('errorMsg').classList.remove('show');
}
function setLoading(loading) {
  const btn = document.getElementById('submitBtn');
  const spinner = document.getElementById('spinner');
  const btnText = document.getElementById('btnText');
  btn.disabled = loading;
  spinner.style.display = loading ? 'inline-block' : 'none';
  btnText.textContent = loading ? 'Signing in…' : 'Sign In to Quantora';
}

async function handleLogin(e) {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  if (!email || !password) { showError('Please fill in all fields.'); return; }

  setLoading(true);
  try {
    const r = await fetch(`${B}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await r.json();
    if (!r.ok) { showError(data.error || 'Login failed. Check your credentials.'); return; }

    // Store token
    localStorage.setItem('q_token', data.token);
    localStorage.setItem('q_user', JSON.stringify({ email: data.email, name: data.name, plan: data.plan }));

    showSuccess(`Welcome back, ${data.name || data.email}! Redirecting…`);
    setTimeout(() => { window.location.href = '/'; }, 1000);
  } catch (err) {
    showError('Connection error. Please try again.');
  } finally {
    setLoading(false);
  }
}

// If already logged in, redirect
(async () => {
  const token = localStorage.getItem('q_token');
  if (token) {
    try {
      const r = await fetch(`${B}/auth/me`, { headers: { Authorization: `Bearer ${token}` } });
      if (r.ok) { window.location.href = '/'; }
    } catch(e) {}
  }
})();
</script>
</body>
</html>
