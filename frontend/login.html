<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Quantora Sign In</title>
<style>
body{margin:0;font-family:Inter,Arial;background:#06101d;color:#fff;padding:40px}
.wrap{max-width:720px;margin:auto}
.card{background:#0d1a2b;border:1px solid #203251;border-radius:16px;padding:24px}
input,button{width:100%;padding:12px;margin-top:10px;border-radius:10px;border:none;box-sizing:border-box}
input{background:#07111f;color:#fff;border:1px solid #203251}
button{background:#2455d6;color:white;font-weight:700;cursor:pointer}
.muted{color:#9fb3d8}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1 style="margin-top:0">Sign In</h1>
    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <button onclick="login()">Continue</button>
    <div class="muted" id="msg" style="margin-top:12px"></div>
  </div>
</div>
<script>
async function login(){
  const payload = { email: document.getElementById('email').value, password: document.getElementById('password').value };
  const r = await fetch('/api/user/login', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
  const data = await r.json();
  if(!r.ok){ document.getElementById('msg').textContent = data.detail || 'Login failed'; return; }
  window.location.href = 'investor_portal.html';
}
</script>
</body>
</html>
