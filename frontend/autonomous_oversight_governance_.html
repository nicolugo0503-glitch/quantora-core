<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>QNT30398 Autonomous Oversight & Governance Control Layer</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; background: #09101d; color: #eef2fb; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .card { background: #121b2f; border: 1px solid #2c3959; border-radius: 12px; padding: 16px; }
    button, input, select { padding: 10px; border-radius: 8px; }
    input, select { width: 100%; margin-top: 6px; margin-bottom: 12px; border: 1px solid #44527a; background: #0f1530; color: #fff; }
    button { border: 0; cursor: pointer; margin-right: 8px; }
    pre { white-space: pre-wrap; background: #0b1020; border: 1px solid #2a395a; padding: 12px; border-radius: 8px; min-height: 220px; }
  </style>
</head>
<body>
  <h1>QNT30398 — Autonomous Oversight & Governance Control Layer</h1>
  <div class="grid">
    <div class="card">
      <h3>Oversight</h3>
      <label>Source</label>
      <input id="source" value="execution_drift_monitor" />
      <label>Metric</label>
      <input id="metric" value="execution_drift" />
      <label>Value</label>
      <input id="value" value="0.22" />
      <label>Threshold</label>
      <input id="threshold" value="0.15" />
      <label>Severity</label>
      <select id="severity">
        <option>warning</option>
        <option>critical</option>
      </select>
      <button onclick="ingestSignal()">Ingest Signal</button>
      <button onclick="loadStatus()">Refresh Status</button>
      <pre id="left"></pre>
    </div>
    <div class="card">
      <h3>Governance Actions</h3>
      <button onclick="requestApproval()">Request Approval</button>
      <button onclick="toggleFreeze()">Toggle Freeze</button>
      <button onclick="loadBreaches()">Load Breaches</button>
      <pre id="right"></pre>
    </div>
  </div>
<script>
async function loadStatus(){
  const res = await fetch('/governance/status');
  document.getElementById('left').textContent = JSON.stringify(await res.json(), null, 2);
}
async function ingestSignal(){
  const payload = {
    source: document.getElementById('source').value,
    metric: document.getElementById('metric').value,
    value: parseFloat(document.getElementById('value').value),
    threshold: parseFloat(document.getElementById('threshold').value),
    severity: document.getElementById('severity').value
  };
  const res = await fetch('/governance/signal/ingest', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload)
  });
  document.getElementById('left').textContent = JSON.stringify(await res.json(), null, 2);
}
async function requestApproval(){
  const res = await fetch('/governance/approval/request', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      action_type: 'capital_override',
      requested_by: 'governance-admin',
      summary: 'Temporary oversight review request'
    })
  });
  document.getElementById('right').textContent = JSON.stringify(await res.json(), null, 2);
}
async function toggleFreeze(){
  const res = await fetch('/governance/freeze?enabled=true&reason=manual_review', { method: 'POST' });
  document.getElementById('right').textContent = JSON.stringify(await res.json(), null, 2);
}
async function loadBreaches(){
  const res = await fetch('/governance/breaches');
  document.getElementById('right').textContent = JSON.stringify(await res.json(), null, 2);
}
loadStatus();
</script>
</body>
</html>
