<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Quantora QNT30366 Release Audit</title>
  <style>
    :root { --bg:#07111f; --panel:#0f1d31; --panel2:#132742; --line:#22314e; --text:#e5eefc; --muted:#9bb0d1; --accent:#60a5fa; }
    *{box-sizing:border-box} body{margin:0;font-family:Inter,Arial,sans-serif;background:linear-gradient(180deg,#040b15 0%,#0a1424 100%);color:var(--text)}
    .shell{max-width:1280px;margin:0 auto;padding:24px}.panel{background:rgba(15,29,49,.95);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}
    .metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.metric{background:#0a1526;border:1px solid #1e2d47;border-radius:14px;padding:14px}
    .label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}.value{font-size:26px;font-weight:700;margin-top:8px}
    button{border:none;background:var(--accent);color:white;padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:700} button.secondary{background:#1d4ed8}
    pre{margin:0;background:#06101d;border:1px solid #1e2d47;border-radius:14px;padding:14px;min-height:320px;white-space:pre-wrap}
    @media(max-width:900px){.metrics{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="shell">
  <div class="panel">
    <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap">
      <div>
        <h1 style="margin:0 0 8px 0;">Release Audit + Deployment Verification</h1>
        <div style="color:#9bb0d1">Validate that Railway is running the normalized release, expected panels exist, expected endpoints exist, and stale version markers are gone.</div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="secondary" onclick="window.location.href='index.html'">Command Center</button>
        <button onclick="loadAudit()">Run Audit</button>
      </div>
    </div>
  </div>

  <div class="metrics">
    <div class="metric"><div class="label">Release</div><div class="value" id="m1">-</div></div>
    <div class="metric"><div class="label">Endpoint Coverage</div><div class="value" id="m2">-</div></div>
    <div class="metric"><div class="label">Panel Coverage</div><div class="value" id="m3">-</div></div>
    <div class="metric"><div class="label">Stale Markers</div><div class="value" id="m4">-</div></div>
  </div>

  <div class="panel"><pre id="out">Loading...</pre></div>
</div>
<script>
const API="http://127.0.0.1:8010";
async function req(path){ const r=await fetch(API+path); const d=await r.json(); if(!r.ok) throw new Error(JSON.stringify(d)); return d; }
async function loadAudit(){
  try{
    const rel = await req("/release/status");
    const data = await req("/release-audit/status");
    document.getElementById("m1").textContent = rel.release_id;
    document.getElementById("m2").textContent = data.summary.endpoint_coverage_pct + "%";
    document.getElementById("m3").textContent = data.summary.panel_coverage_pct + "%";
    document.getElementById("m4").textContent = data.summary.stale_marker_count;
    document.getElementById("out").textContent = JSON.stringify({release:rel, audit:data}, null, 2);
  }catch(e){ document.getElementById("out").textContent = String(e); }
}
loadAudit();
</script>
</body>
</html>
