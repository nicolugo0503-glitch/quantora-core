<!doctype html>
<html>
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Quantora Distribution</title><script src="/config.js"></script></head>
<body style="font-family: Arial, sans-serif; margin: 32px;">
  <h1>Allocator Distribution</h1>
  <button onclick="loadLog()">Load distribution log</button>
  <pre id="out">Ready.</pre>
  <script>
    const API = window.QUANTORA_CONFIG.API_BASE_URL;
    async function loadLog(){
      const res = await fetch(`/reporting/distribution-log`);
      const data = await res.json();
      document.getElementById('out').textContent = JSON.stringify(data, null, 2);
    }
  </script>
</body>
</html>
