<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Quantora QNT30525 Portfolio Sync</title>
  <style>
    :root { --bg:#08111f; --panel:#0e1a2b; --border:#1f3556; --text:#eef4ff; --muted:#9bb0ce; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial,Helvetica,sans-serif; background:var(--bg); color:var(--text); padding:24px; }
    .btn { display:inline-block; color:#fff; background:#2455d6; border:1px solid #3f6fff; border-radius:10px; padding:10px 14px; text-decoration:none; font-weight:700; cursor:pointer; }
    .btn.secondary { background:#12233b; border-color:var(--border); }
    .panel { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:18px; margin-bottom:16px; }
    .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
    .muted { color:var(--muted); }
    pre { width:100%; min-height:220px; background:#07111f; border:1px solid var(--border); border-radius:10px; padding:14px; color:var(--text); overflow:auto; }
    @media (max-width:900px) { .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px">
    <div>
      <h1 style="margin:0 0 6px">QNT30525 — Portfolio State Sync</h1>
      <div class="muted">Real position tracking, account state sync, and live PnL aggregation.</div>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <a class="btn secondary" href="conversation_missions_hub.html">Back to Missions Hub</a>
      <a class="btn" href="index.html">Back to Command Center</a>
    </div>
  </div>

  <div class="panel">
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <a class="btn" href="#" onclick="syncNow();return false;">Sync Portfolio Now</a>
      <a class="btn secondary" href="#" onclick="refreshData();return false;">Refresh</a>
    </div>
  </div>

  <div class="grid">
    <div class="panel">
      <div class="muted">Current Portfolio State</div>
      <pre id="stateBox">loading...</pre>
    </div>
    <div class="panel">
      <div class="muted">Sync History</div>
      <pre id="historyBox">loading...</pre>
    </div>
  </div>

  <script>
    async function fetchJson(url, options) {
      try {
        const res = await fetch(url, options || {});
        if (!res.ok) throw new Error("HTTP " + res.status);
        return await res.json();
      } catch (e) {
        return null;
      }
    }

    async function syncNow() {
      const data = await fetchJson('/api/portfolio/sync', { method: 'POST' });
      document.getElementById('stateBox').textContent = JSON.stringify(data || { error: 'sync endpoint not found yet' }, null, 2);
      refreshData();
    }

    async function refreshData() {
      const state = await fetchJson('/api/portfolio/state');
      const hist = await fetchJson('/api/portfolio/history');
      document.getElementById('stateBox').textContent = JSON.stringify(state || { error: 'state endpoint not found yet' }, null, 2);
      document.getElementById('historyBox').textContent = JSON.stringify(hist || { error: 'history endpoint not found yet' }, null, 2);
    }

    refreshData();
  </script>
</body>
</html>
