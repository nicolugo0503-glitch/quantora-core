<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>QNT30396 Full End-to-End Trade Lifecycle Integration</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; background: #09101d; color: #eef2fb; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .card { background: #121b2f; border: 1px solid #2c3959; border-radius: 12px; padding: 16px; }
    button { padding: 10px; border-radius: 8px; border: 0; cursor: pointer; margin-right: 8px; }
    pre { white-space: pre-wrap; background: #0b1020; border: 1px solid #2a395a; padding: 12px; border-radius: 8px; min-height: 220px; }
  </style>
</head>
<body>
  <h1>QNT30396 — Full End-to-End Trade Lifecycle Integration</h1>
  <div class="grid">
    <div class="card">
      <h3>Demo Lifecycle</h3>
      <button onclick="runDemo()">Run Demo Lifecycle</button>
      <button onclick="loadStatus()">Refresh Status</button>
      <pre id="left"></pre>
    </div>
    <div class="card">
      <h3>Lifecycle Events</h3>
      <button onclick="loadLifecycle()">Load Lifecycle</button>
      <button onclick="loadPositions()">Load Positions</button>
      <pre id="right"></pre>
    </div>
  </div>
<script>
async function runDemo(){
  const res = await fetch('/trade-lifecycle/run-demo', { method: 'POST' });
  document.getElementById('left').textContent = JSON.stringify(await res.json(), null, 2);
}
async function loadStatus(){
  const res = await fetch('/trade-lifecycle/status');
  document.getElementById('left').textContent = JSON.stringify(await res.json(), null, 2);
}
async function loadLifecycle(){
  const res = await fetch('/trade-lifecycle/lifecycle');
  document.getElementById('right').textContent = JSON.stringify(await res.json(), null, 2);
}
async function loadPositions(){
  const res = await fetch('/trade-lifecycle/positions');
  document.getElementById('right').textContent = JSON.stringify(await res.json(), null, 2);
}
loadStatus();
</script>
</body>
</html>
